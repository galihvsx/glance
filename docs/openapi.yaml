        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "properties": { "parent_uuid": { "type": "string", "format": "uuid", "nullable": true, "description": "New parent issue UUID; null promotes the issue back to a standalone issue" } } } } } },
        "responses": { "200": { "description": "Conversion result", "content": { "application/json": { "schema": { "type": "object", "properties": { "converted": { "type": "boolean" }, "issue": { "$ref": "#/components/schemas/Issue" } } } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "409": { "$ref": "#/components/responses/Conflict" } }
