    "/api/v1/workspaces/{slug}/webhooks/{id}/deliveries/{deliveryId}/redeliver": {
      "post": {
        "tags": ["webhooks"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Redeliver a failed webhook delivery",
        "description": "Admin only. Enqueues a FRESH outbox row (attempts 0, pending, due now) for a failed delivery, built from the webhook's CURRENT row (current URL + current secret — if the admin changed the URL since the failure, the redelivery goes to the current URL). The original history row is untouched; the redelivery's own attempts create NEW history rows. 202 means the redelivery was enqueued — delivery itself is async. 409 when the delivery is not failed (retrying retries automatically; delivered needs no redelivery) or the webhook is inactive. 404 when the webhook or the delivery is unknown, or the delivery belongs to another webhook (never leak cross-webhook existence).",
        "parameters": [ { "$ref": "#/components/parameters/Slug" }, { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }, { "name": "deliveryId", "in": "path", "required": true, "schema": { "type": "integer", "format": "int64" } } ],
