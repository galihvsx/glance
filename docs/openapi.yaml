    "/api/v1/widgets/{widget_id}/data": {
      "get": {
        "tags": ["dashboards"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Get live widget data",
        "description": "Recomputes the widget live from the issues table: live issues (deleted_at/archived_at IS NULL) in the dashboard's workspace, narrowed to the widget's project_ids (empty = every non-archived workspace project) ANDed with config.filters, grouped by config.group_by. bar|line|area|donut|pie return {groups:[{key,label,value}]} where the key IS the human label the frontend renders (state name, priority label None/Low/Medium/High/Urgent, assignee display name, label name, state-group display name, project name, creator display name); assignee grouping adds an \\\"Unassigned\\\" bucket and label grouping a \\\"No label\\\" bucket so groups partition every counted issue. number returns {value}. smart_counter|table_2d return {groups:[{key,label,value}], page, max_rows, total_groups} (groups holds only the requested page). smart_gauge returns {groups:[{key,label,value,completed,percentage}], page, max_rows, total_groups} (value = issue count, or summed estimate points when metric=estimate_points; completed = the completed share; percentage = 100*completed/value, 0 when value is 0). intake_breakdown returns {intake:{in_app_volume,email_volume,form_volume,total_accepted,total_rejected,avg_decide_seconds,total_duplicate,pending,snoozed}} (pending uses the inbox EffectiveStatus rule - status pending plus resurfaced snoozed; snoozed is still-snoozed only) (email_volume is always 0: no email ingestion; widget-level filters and project_ids are ignored - the dashboard's project scope only). work_items_table|assigned_to_me return {rows:[{id,title,state,state_group,priority,assignee:{id,name}|null,labels:[{id,name,color}],project:{id,name}}], page, max_rows, total} (rows holds only the requested page in the config sort order; the full row is always returned - the configured columns only decide what the frontend renders and what the CSV carries; assigned_to_me forces assignee = the caller at compute time, overriding any filters.assignees entry). The paginated types take ?page= (default 1, must be >= 1, else 400). Read authZ = the dashboard's viewer rule (member 15+; a private dashboard of another creator without a share is 404).",
        "parameters": [ { "name": "widget_id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }, { "name": "page", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "default": 1 }, "description": "Paginated widget types only (smart_counter|smart_gauge|table_2d|work_items_table|assigned_to_me): the page to return" } ],
        "responses": { "200": { "description": "Live widget data", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WidgetData" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
