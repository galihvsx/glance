        "responses": { "200": { "description": "Move report", "content": { "application/json": { "schema": { "type": "object", "properties": { "issue": { "$ref": "#/components/schemas/Issue" }, "new_display_id": { "type": "string" }, "state_remapped": { "type": "boolean" }, "labels_dropped": { "type": "array", "items": { "type": "string" } }, "estimate_dropped": { "type": "boolean" }, "memberships_dropped": { "type": "object", "properties": { "cycles": { "type": "integer" }, "modules": { "type": "integer" }, "releases": { "type": "integer" } } }, "custom_values_dropped": { "type": "integer" } } } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
