{
  "openapi": "3.0.0",
  "info": {
    "title": "glance API",
    "version": "0.3.0-dev",
    "description": "Public HTTP API of glance, the lean Plane-like issue tracker (Go monolith, single binary). All paths are relative to the server root. NOTE ON FORMAT: this file is written in JSON syntax, which is valid YAML 1.2 — docs/openapi.yaml and the served GET /api/v1/openapi.json are the SAME single file with no build-time conversion; keep it JSON-compatible so both parsers accept it."
  },
  "servers": [
    { "url": "/", "description": "Same origin as the glance server (self-hosted)" }
  ],
  "security": [],
  "tags": [
    { "name": "auth", "description": "Passwordless auth: email OTP, OAuth, sessions" },
    { "name": "workspaces", "description": "Workspaces and membership" },
    { "name": "projects", "description": "Projects inside a workspace" },
    { "name": "issues", "description": "Issues, sub-issues, comments, reactions, votes, attachments, shares" },
    { "name": "taxonomy", "description": "Labels, states, estimate scales" },
    { "name": "cycles", "description": "Sprints / cycles" },
    { "name": "modules", "description": "Modules (feature groupings)" },
    { "name": "pages", "description": "Wiki pages" },
    { "name": "releases", "description": "Releases" },
    { "name": "intake", "description": "Intake inbox triage" },
    { "name": "activity", "description": "Project and workspace activity feeds" },
    { "name": "analytics", "description": "Analytics summaries, burndown, trends" },
    { "name": "workload", "description": "Per-member workload report and weekly capacity" },
    { "name": "risk", "description": "Per-project risk scores and contributing factors" },
    { "name": "time", "description": "Time tracking entries and summaries" },
    { "name": "templates", "description": "Issue templates" },
    { "name": "project-templates", "description": "Workspace project templates (blueprints applied at project creation)" },
    { "name": "custom-fields", "description": "Project custom fields and per-issue values" },
    { "name": "webhooks", "description": "Workspace webhooks" },
    { "name": "notifications", "description": "Notifications and per-event preferences" },
    { "name": "favorites", "description": "Starred issues and projects" },
    { "name": "tokens", "description": "Personal API tokens (session-cookie only)" },
    { "name": "search", "description": "Cross-project search and work-item lookup" },
    { "name": "ai", "description": "AI-assisted drafting and triage (optional, provider-backed)" },
    { "name": "admin", "description": "Instance administration (server admin role)" },
    { "name": "import", "description": "CSV issue import" },
    { "name": "meta", "description": "API metadata (this spec)" },
    { "name": "integrations", "description": "Inbound third-party integrations (GitHub repo webhook)" }
  ],
  "paths": {
    "/api/v1/auth/otp/request": {
      "post": {
        "tags": ["auth"], "security": [],
        "summary": "Request a one-time login code",
        "description": "Always answers 200 {\"ok\": true} — even for unknown or malformed emails — so the endpoint never reveals whether an address is registered. 400 on unparseable body, 429 when rate limited.",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["email"], "properties": { "email": { "type": "string", "format": "email" } } } } } },
        "responses": { "200": { "description": "Accepted (no enumeration)", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Ok" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "429": { "$ref": "#/components/responses/RateLimited" } }
      }
    },
    "/api/v1/auth/otp/verify": {
      "post": {
        "tags": ["auth"], "security": [],
        "summary": "Verify a one-time code and start a session",
        "description": "Every failure (unknown email, expired/consumed code, wrong code) answers 401 with the same generic message. Success sets the glance_session HttpOnly cookie and answers 200 {\"ok\": true}.",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["email", "code"], "properties": { "email": { "type": "string", "format": "email" }, "code": { "type": "string" } } } } } },
        "responses": { "200": { "description": "Session started (cookie set)", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Ok" } } } }, "401": { "$ref": "#/components/responses/Unauthorized" }, "429": { "$ref": "#/components/responses/RateLimited" } }
      }
    },
    "/api/v1/auth/oauth/{provider}/login": {
      "get": {
        "tags": ["auth"], "security": [],
        "summary": "Start an OAuth login flow",
        "description": "Redirects the browser to the provider (google or github). Requires OAUTH_STATE_SECRET on the server or the endpoint refuses to operate.",
        "parameters": [ { "name": "provider", "in": "path", "required": true, "schema": { "type": "string", "enum": ["google", "github"] } } ],
        "responses": { "302": { "description": "Redirect to the OAuth provider" } }
      }
    },
    "/api/v1/auth/oauth/{provider}/callback": {
      "get": {
        "tags": ["auth"], "security": [],
        "summary": "OAuth provider callback",
        "description": "Exchanges the provider code, creates/links the user, sets the glance_session cookie, and redirects to the app.",
        "parameters": [ { "name": "provider", "in": "path", "required": true, "schema": { "type": "string", "enum": ["google", "github"] } } ],
        "responses": { "302": { "description": "Redirect to the app (session cookie set)" }, "400": { "$ref": "#/components/responses/BadRequest" } }
      }
    },
    "/api/v1/auth/logout": {
      "post": {
        "tags": ["auth"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Log out the current session",
        "description": "Revokes the current session row and clears the cookie.",
        "responses": { "200": { "description": "Logged out", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Ok" } } } }, "401": { "$ref": "#/components/responses/Unauthorized" } }
      }
    },
    "/api/v1/auth/me": {
      "patch": {
        "tags": ["auth"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Update my display name",
        "description": "Email is identity (OTP/OAuth) and is never editable here.",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["name"], "properties": { "name": { "type": "string", "maxLength": 100 } } } } } },
        "responses": { "200": { "description": "Updated user", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/User" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" } }
      }
    },
    "/api/v1/me": {
      "get": {
        "tags": ["auth"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Get the current user",
        "responses": { "200": { "description": "Current user", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/User" } } } }, "401": { "$ref": "#/components/responses/Unauthorized" } }
      }
    },
    "/api/v1/me/calendar-token": {
      "get": {
        "tags": ["calendar"], "security": [{ "sessionCookie": [] }],
        "summary": "Get calendar feed token status",
        "description": "Whether the caller has a live iCal feed token (glcal_…) and its timestamps. Session-cookie only: a token must never manage feed tokens. The secret itself is never returned — it is shown once at creation.",
        "responses": { "200": { "description": "Feed token status", "content": { "application/json": { "schema": { "type": "object", "properties": { "active": { "type": "boolean" }, "created_at": { "type": "string", "format": "date-time" }, "last_used_at": { "type": "string", "format": "date-time" } } } } } }, "401": { "$ref": "#/components/responses/Unauthorized" } }
      },
      "post": {
        "tags": ["calendar"], "security": [{ "sessionCookie": [] }],
        "summary": "Mint or regenerate the calendar feed token",
        "description": "Session-cookie only. Regenerate semantics: any existing live feed token is revoked first, so at most one live token per user exists. The plaintext (glcal_…) is returned exactly once in the 201 body — there is no endpoint that reveals it again. Append it as ?token= to a calendar.ics URL for external calendar apps.",
        "responses": { "201": { "description": "Created (plaintext shown once)", "content": { "application/json": { "schema": { "type": "object", "properties": { "token": { "type": "string" }, "created_at": { "type": "string", "format": "date-time" } } } } } }, "401": { "$ref": "#/components/responses/Unauthorized" } }
      },
      "delete": {
        "tags": ["calendar"], "security": [{ "sessionCookie": [] }],
        "summary": "Revoke the calendar feed token",
        "description": "Session-cookie only. After revocation, feed fetches with the old token answer 401.",
        "responses": { "204": { "description": "Revoked" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/auth/sessions": {
      "get": {
        "tags": ["auth"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "List my active sessions",
        "description": "Never includes token hashes. Each row carries a `current` flag for the caller's own session.",
        "responses": { "200": { "description": "Session list", "content": { "application/json": { "schema": { "type": "object", "properties": { "sessions": { "type": "array", "items": { "$ref": "#/components/schemas/Session" } } } } } } }, "401": { "$ref": "#/components/responses/Unauthorized" } }
      }
    },
    "/api/v1/auth/sessions/{id}": {
      "delete": {
        "tags": ["auth"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Revoke one of my sessions",
        "description": "A session that does not exist, is already revoked, belongs to another user, or is malformed all answer 404 — the endpoint never reveals which case hit. Revoking the current session also clears its cookie.",
        "parameters": [ { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } } ],
        "responses": { "200": { "description": "Revoked", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Ok" } } } }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/tokens": {
      "get": {
        "tags": ["tokens"], "security": [{ "sessionCookie": [] }],
        "summary": "List my API tokens",
        "description": "Session-cookie only: a token must never be able to mint or list tokens. Never reveals plaintext (shown once at creation).",
        "responses": { "200": { "description": "Token list", "content": { "application/json": { "schema": { "type": "object", "properties": { "tokens": { "type": "array", "items": { "$ref": "#/components/schemas/Token" } } } } } } }, "401": { "$ref": "#/components/responses/Unauthorized" } }
      },
      "post": {
        "tags": ["tokens"], "security": [{ "sessionCookie": [] }],
        "summary": "Mint a personal API token",
        "description": "Session-cookie only. The plaintext (gl_…) is returned exactly once in the 201 body — there is no endpoint that reveals it again. Scopes: read (GETs), write (implies read).",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["name", "scopes"], "properties": { "name": { "type": "string" }, "scopes": { "type": "array", "items": { "type": "string", "enum": ["read", "write"] } }, "expires_at": { "type": "string", "format": "date-time", "description": "Optional; absent = never expires" } } } } } },
        "responses": { "201": { "description": "Created (plaintext shown once)", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreatedToken" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" } }
      }
    },
    "/api/v1/tokens/{id}": {
      "delete": {
        "tags": ["tokens"], "security": [{ "sessionCookie": [] }],
        "summary": "Revoke an API token",
        "description": "Session-cookie only.",
        "parameters": [ { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } } ],
        "responses": { "204": { "description": "Revoked" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/ws/ticket": {
      "post": {
        "tags": ["auth"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Mint a single-use websocket ticket",
        "description": "Token clients connect with /ws?ticket=<ticket>. The ticket is single-use and expires after 60 seconds.",
        "responses": { "200": { "description": "Ticket", "content": { "application/json": { "schema": { "type": "object", "properties": { "ticket": { "type": "string" } } } } } }, "401": { "$ref": "#/components/responses/Unauthorized" } }
      }
    },
    "/api/v1/openapi.json": {
      "get": {
        "tags": ["meta"], "security": [],
        "summary": "This OpenAPI spec as JSON",
        "description": "Serves docs/openapi.yaml verbatim (the file is JSON syntax, valid YAML 1.2) with application/json. No auth required.",
        "responses": { "200": { "description": "OpenAPI 3.0 document", "content": { "application/json": { "schema": { "type": "object" } } } } }
      }
    },
    "/api/v1/workspaces": {
      "get": {
        "tags": ["workspaces"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "List my workspaces",
        "description": "The caller's workspaces with their role in each.",
        "responses": { "200": { "description": "Workspace list", "content": { "application/json": { "schema": { "type": "object", "properties": { "workspaces": { "type": "array", "items": { "$ref": "#/components/schemas/WorkspaceMembership" } } } } } } } }
      },
      "post": {
        "tags": ["workspaces"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Create a workspace",
        "description": "Creates the workspace with the caller as admin.",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["name"], "properties": { "name": { "type": "string" }, "slug": { "type": "string", "description": "Optional; derived from name when omitted" } } } } } },
        "responses": { "201": { "description": "Created workspace", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Workspace" } } } }, "400": { "$ref": "#/components/responses/BadRequest" } }
      }
    },
    "/api/v1/workspaces/{slug}": {
      "get": {
        "tags": ["workspaces"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Get a workspace",
        "description": "Non-members get 404 — never a hint the slug exists.",
        "parameters": [ { "$ref": "#/components/parameters/Slug" } ],
        "responses": { "200": { "description": "Workspace with my role", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WorkspaceMembership" } } } }, "404": { "$ref": "#/components/responses/NotFound" } }
      },
      "patch": {
        "tags": ["workspaces"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Update a workspace",
        "description": "Admin only. Rename (name, optional slug change), set/clear the Slack incoming-webhook URL, and/or set/clear the GitHub repo-webhook secret. Secrets are write-only and never returned — responses carry slack_configured / github_webhook_configured instead.",
        "parameters": [ { "$ref": "#/components/parameters/Slug" } ],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "properties": { "name": { "type": "string" }, "slug": { "type": "string" }, "slack_webhook_url": { "type": "string", "nullable": true, "description": "Slack incoming-webhook URL (must be https://hooks.slack.com/…). Null or empty clears. Omitted leaves it unchanged." }, "github_webhook_secret": { "type": "string", "nullable": true, "description": "GitHub repo-webhook secret used to verify X-Hub-Signature-256 on inbound deliveries (1-256 printable ASCII chars, no whitespace). Null or empty clears. Omitted leaves it unchanged." } } } } } },
        "responses": { "200": { "description": "Updated workspace", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Workspace" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      },
      "delete": {
        "tags": ["workspaces"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Delete a workspace",
        "description": "Admin only. Destroys the workspace and everything in it.",
        "parameters": [ { "$ref": "#/components/parameters/Slug" } ],
        "responses": { "204": { "description": "Deleted" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/workspaces/{slug}/import": {
      "post": {
        "tags": ["workspaces"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Import a workspace data archive",
        "description": "Admin only. Restores a glance-export/1 JSON archive (as produced by GET /api/v1/workspaces/{slug}/export) into this workspace. multipart/form-data with a `file` field (the archive JSON); 100MB limit. Restore-by-UUID: rows whose UUID already exists are skipped, so re-import is idempotent. Members are matched to instance users by email (never auto-created); unmapped members are skipped and reported. Attachment binaries are never exported and cannot be restored — attachment metadata is counted as skipped. Returns an honest import report {format, source_workspace, target_workspace, imported, skipped}. Archives with an unknown format version are refused with 400 and import nothing.",
        "parameters": [ { "$ref": "#/components/parameters/Slug" } ],
        "requestBody": { "required": true, "content": { "multipart/form-data": { "schema": { "type": "object", "required": ["file"], "properties": { "file": { "type": "string", "format": "binary", "description": "glance-export/1 archive JSON" } } } } } },
        "responses": { "200": { "description": "Import report", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ArchiveImportReport" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "413": { "$ref": "#/components/responses/PayloadTooLarge" } }
      }
    },
    "/api/v1/workspaces/{slug}/export": {
      "get": {
        "tags": ["workspaces"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Export full workspace data archive",
        "description": "Admin only. Streams the entire workspace as a single JSON archive (format \"glance-export/1\") with chunked encoding: workspace, members, projects, states, labels, estimates, custom fields, cycles, modules, pages, and issues with nested comments, custom values, assignees, labels and attachment metadata. Attachment binaries are NOT included (metadata only) and the server-side stored_path is never exported. Restore an archive with POST /api/v1/workspaces/{slug}/import (admin only); the importer honors the format version pin and refuses unknown versions.",
        "parameters": [ { "$ref": "#/components/parameters/Slug" } ],
        "responses": { "200": { "description": "JSON archive download (Content-Disposition: attachment)", "content": { "application/json": { "schema": { "type": "object", "properties": { "format": { "type": "string", "example": "glance-export/1" } } } } } }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/workspaces/{slug}/audit-log": {
      "get": {
        "tags": ["workspaces"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "List the workspace audit log",
        "description": "Workspace Admin only (role 20). Append-only record of control-plane events — membership, role, project lifecycle, workspace settings, integrations — newest first. Non-members get 404, member non-admins 403. Filters: action (exact, e.g. member.invited), actor_id (uuid), actor (case-insensitive actor_email substring), entity_type, since/until (RFC 3339).",
        "parameters": [
          { "$ref": "#/components/parameters/Slug" },
          { "name": "page", "in": "query", "schema": { "type": "integer", "default": 1 } },
          { "name": "per_page", "in": "query", "schema": { "type": "integer", "default": 25 } },
          { "name": "action", "in": "query", "schema": { "type": "string" } },
          { "name": "actor_id", "in": "query", "schema": { "type": "string", "format": "uuid" } },
          { "name": "actor", "in": "query", "schema": { "type": "string", "description": "Case-insensitive actor_email substring" } },
          { "name": "entity_type", "in": "query", "schema": { "type": "string" } },
          { "name": "since", "in": "query", "schema": { "type": "string", "format": "date-time" } },
          { "name": "until", "in": "query", "schema": { "type": "string", "format": "date-time" } }
        ],
        "responses": { "200": { "description": "Paginated audit entries", "content": { "application/json": { "schema": { "type": "object", "properties": { "items": { "type": "array", "items": { "$ref": "#/components/schemas/WorkspaceAuditEntry" } }, "total": { "type": "integer" }, "page": { "type": "integer" }, "per_page": { "type": "integer" } } } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/workspaces/{slug}/audit-log/export": {
      "get": {
        "tags": ["workspaces"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Export the workspace audit log as CSV",
        "description": "Workspace Admin only (role 20). Same filter set and gate as GET .../audit-log. CSV columns: at,actor_email,action,entity_type,entity_id,ip,meta (meta as compact JSON). Hard cap 10,000 rows; a truncated export sets the X-Truncated: true response header. Downloads as audit-log-<slug>-<YYYY-MM-DD>.csv.",
        "parameters": [
          { "$ref": "#/components/parameters/Slug" },
          { "name": "format", "in": "query", "schema": { "type": "string", "enum": ["csv"], "default": "csv" } },
          { "name": "action", "in": "query", "schema": { "type": "string" } },
          { "name": "actor_id", "in": "query", "schema": { "type": "string", "format": "uuid" } },
          { "name": "actor", "in": "query", "schema": { "type": "string", "description": "Case-insensitive actor_email substring" } },
          { "name": "entity_type", "in": "query", "schema": { "type": "string" } },
          { "name": "since", "in": "query", "schema": { "type": "string", "format": "date-time" } },
          { "name": "until", "in": "query", "schema": { "type": "string", "format": "date-time" } }
        ],
        "responses": { "200": { "description": "CSV download (Content-Disposition: attachment; X-Truncated: true when capped)", "content": { "text/csv": { "schema": { "type": "string" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/workspaces/{slug}/slack/test": {
      "post": {
        "tags": ["workspaces"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Send a Slack test message",
        "description": "Admin only. Enqueues a probe message to the workspace's Slack incoming-webhook URL. 202 means the probe was enqueued — delivery itself is async. 400 when no webhook URL is configured.",
        "parameters": [ { "$ref": "#/components/parameters/Slug" } ],
        "responses": { "202": { "description": "Test message enqueued", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Ok" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/workspaces/{slug}/members": {
      "get": {
        "tags": ["workspaces"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "List workspace members",
        "description": "Any member may read — the issue page's assignee picker needs it.",
        "parameters": [ { "$ref": "#/components/parameters/Slug" } ],
        "responses": { "200": { "description": "Member list", "content": { "application/json": { "schema": { "type": "object", "properties": { "members": { "type": "array", "items": { "$ref": "#/components/schemas/WorkspaceMember" } } } } } } } } 
      },
      "post": {
        "tags": ["workspaces"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Add or re-role a member",
        "description": "Admin only.",
        "parameters": [ { "$ref": "#/components/parameters/Slug" } ],
