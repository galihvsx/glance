        "tags": ["issues"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Move an issue to another project",
        "description": "Moves the issue (plus its whole sub-issue subtree) into another project of the same workspace in one transaction, and returns the move report. The issue keeps its UUID; each moved issue gets a fresh display ID from the target project's issue_sequences and a `_moved` activity entry. State is matched by name (case-insensitive) in the target project, else the target's default backlog state (state_remapped). Labels match by name; unmatched are dropped (labels_dropped). Estimate matches by value in the target scale, else nulled (estimate_dropped). Assignees, watchers, comments, attachments, links, relations, reactions, votes and time entries move with the issue. Cycle/module/release memberships and custom field values are project-scoped and dropped (reported). 400 when the target is the same project, the issue is still in the intake inbox, or the target identifier is missing/malformed; 404 when the issue or target project is missing. Member (15)+ on both projects; Idempotency-Key honored.",
