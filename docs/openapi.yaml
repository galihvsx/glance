        "tags": ["dashboards"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Drill into one chart segment",
        "description": "The items behind one chart segment: the widget's own human-label group key (the Key or the Label getWidgetData returns for the segment) is mapped back to the dimension's filter value with the SAME resolution the data compute uses; an unresolvable key is 400 (never a guess). group is required (400 when missing). Types without groups (number, work_items_table, assigned_to_me) are 400 - drill-down is not available for them. intake_breakdown widgets drill by metric instead of group: ?metric= is required (400 when missing); metric in in_app|form|email|accepted|rejected|duplicate|pending|snoozed; avg_decide is 400 (an aggregate, not a row set); unknown metrics are 400; ?group= is meaningless for intake tiles and ignored. Scope is every non-archived project of the workspace (widget-level filters and project_ids ignored). pending = status pending plus resurfaced snoozed (the inbox EffectiveStatus rule); snoozed = still-snoozed only; email returns an empty list (glance has no email ingestion - rows are never faked). per_page defaults to 10 (intake_breakdown configs reject max_rows, so the C84 max_rows-fallback convention cannot apply) and is capped at 100 (400 past it). Grouped widgets return WidgetDrilldown; intake_breakdown widgets return IntakeDrilldown: {items:[IntakeDrilldownItem], page, per_page, total, metric}, with status/status_name carrying the EFFECTIVE status. The item set is the widget's base filters (dashboard project scope + widget project_ids + widget filters) ANDed with the segment's group filter; for smart_counter|smart_gauge the metric changes the displayed group value, NOT the item set. Response: {items:[WidgetRowItem], page, per_page (the widget's max_rows), total, group_label, group_by}; items are most-recently-updated first. Read authZ = the widget read rule (a shared-view member may drill; a private dashboard of another creator without a share is 404). C87 bucket window on intake_breakdown widgets: ?granularity=day|week|month&bucket_start=YYYY-MM-DD lists the rows created in one trend bucket (the trend-chart click). Both params or neither (one without the other is 400); unknown granularity, malformed date, or a misaligned start (not a Monday for week, not the 1st for month) is 400. Windows are half-open UTC calendar periods: day [start, start+1d); week [Monday, Monday+7d); month [1st, next 1st). The bucket ANDs onto the metric predicate when metric is given; without metric it lists every row created in the bucket (any source/status) and the response carries metric \"\" - metric is optional only with a bucket. pending/snoozed keep their C85 EFFECTIVE-status definitions AND the creation-bucket filter. total counts the bucket-filtered rows; granularity and bucket_start are echoed only when the bucket filter is present (absent otherwise). Grouped-widget drill-down ignores granularity/bucket_start entirely (no 400 on the ignored params).",
        "parameters": [ { "name": "widget_id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }, { "name": "group", "in": "query", "required": true, "schema": { "type": "string" }, "description": "The widget's human-label group key for the segment to drill into (grouped widgets only; ignored for intake_breakdown)" }, { "name": "metric", "in": "query", "required": false, "schema": { "type": "string", "enum": ["in_app", "form", "email", "accepted", "rejected", "duplicate", "pending", "snoozed"] }, "description": "intake_breakdown only: the tile to drill into (required for intake_breakdown widgets, ignored for grouped widgets; avg_decide is not a row set)" }, { "name": "per_page", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 10 }, "description": "intake_breakdown only: rows per page (default 10; capped at 100)" }, { "name": "page", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "default": 1 }, "description": "The page of the segment's items to return" }, { "name": "granularity", "in": "query", "required": false, "schema": { "type": "string", "enum": ["day", "week", "month"] }, "description": "intake_breakdown only, with bucket_start: the bucket size (ignored for grouped widgets)" }, { "name": "bucket_start", "in": "query", "required": false, "schema": { "type": "string", "format": "date" }, "description": "intake_breakdown only, with granularity: ISO date of the bucket's first day (any day for day, a Monday for week, the 1st for month; ignored for grouped widgets)" } ],
        "responses": { "200": { "description": "The segment's items", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WidgetDrilldown" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/widgets/{widget_id}/trend": {
      "get": {
        "tags": ["dashboards"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Intake volume trend over time",
        "description": "The time-bucketed intake series for an intake_breakdown widget: consecutive periods ending at the current period (the bucket containing now), so the series always ends 'now'. ?granularity=day|week|month (default week; unknown is 400) and ?buckets=1-52 (default 12; out of range is 400). Week buckets start Monday (ISO week); month buckets are calendar months; day buckets are calendar days (UTC). Per bucket: bucket_start (ISO date of the bucket's first day), in_app, form, email (always 0: glance has no email ingestion), accepted, rejected, duplicate — all counted by the row's created_at falling in the bucket. Decided counts are by CREATION bucket, not decision time: a row decided this week but created last month counts in last month's bucket, keeping created volume vs decided volume comparable within a bucket (triage lag reads as decided < created in recent buckets). Pending/snoozed are not per-bucket series: they are point-in-time states, not creation-time facts. Scope is every non-archived project of the workspace (widget-level filters and project_ids ignored, like the headline numbers). Empty buckets render as zeros (no gaps). Response: {granularity, buckets:[IntakeTrendBucket], total_buckets}. A non-intake_breakdown widget is 400 (trend is an intake concept, not generalized). Read authZ = the widget read rule (a shared-view member may fetch; a private dashboard of another creator without a share is 404).",
        "parameters": [ { "name": "widget_id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }, { "name": "granularity", "in": "query", "required": false, "schema": { "type": "string", "enum": ["day", "week", "month"], "default": "week" }, "description": "Bucket size (default week)" }, { "name": "buckets", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 52, "default": 12 }, "description": "Number of consecutive periods ending at the current period (default 12)" } ],
        "responses": { "200": { "description": "The intake trend series", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/IntakeTrend" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/widgets/{widget_id}/export.csv": {
      "get": {
        "tags": ["dashboards"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Export widget data as CSV",
        "description": "The widget's FULL live dataset as CSV: the same recompute as the data endpoint, but unpaginated (every group, not just the current page), capped at 10,000 data rows (past the cap the response carries X-Result-Truncated: true). Columns per type: key,label,value (charts, smart_counter, table_2d); key,label,completed,total,percentage (smart_gauge); metric,value (intake_breakdown aggregate: the six headline numbers); with ?metric=<metric> on intake_breakdown widgets the drill-down row set instead (id,issue_id,title,project,status,status_name,source,snoozed_till,duplicate_to_id,created_at - same predicate and order as the drill-down, same 10,000-row cap + X-Result-Truncated; without metric the aggregate export is unchanged; avg_decide/unknown metrics are 400; a metric on a non-intake widget is ignored); value (number); the configured columns in order (work_items_table, assigned_to_me - the full dataset rows, capped at 10,000). With ?trend=1 on intake_breakdown widgets the export is the trend series instead (columns bucket_start,in_app,form,email,accepted,rejected,duplicate; + ?granularity=day|week|month and ?buckets=1-52, same validation as the trend endpoint; the 10,000-row cap never binds on a ≤52-row series, so X-Result-Truncated is never set; ?trend=1 on a non-intake widget is 400; without trend the aggregate/metric exports are unchanged). On intake_breakdown widgets (non-trend path only), ?granularity=day|week|month&bucket_start=YYYY-MM-DD (both or neither; unknown granularity, malformed date, or a misaligned start - not a Monday for week, not the 1st for month - is 400) exports the bucket-filtered drill-down row set instead of the aggregate: bucket + metric gives the rows for that metric created in the bucket, bucket without metric gives all rows created in the bucket; same row columns, same 10,000-row cap + X-Result-Truncated, same scope (workspace, non-archived projects, widget filters ignored); the filename appends -<granularity>-<bucket_start> (e.g. ...-week-2026-10-26.csv), so a bucket file is distinguishable from a metric file and a full file; on non-intake and grouped widgets the bucket params are ignored (never 400 on the ignored param); ?trend=1 never reads bucket_start. Content-Disposition: attachment; filename=\\\"<dashboard-slug>-<widget-slug>.csv\\\" (sanitized). Read authZ = the widget read rule (a shared-view member may export).",
        "parameters": [ { "name": "widget_id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }, { "name": "metric", "in": "query", "required": false, "schema": { "type": "string", "enum": ["in_app", "form", "email", "accepted", "rejected", "duplicate", "pending", "snoozed"] }, "description": "intake_breakdown only: dump the drill-down row set for this metric instead of the aggregate export" }, { "name": "trend", "in": "query", "required": false, "schema": { "type": "string", "enum": ["1"] }, "description": "intake_breakdown only: dump the trend series instead of the aggregate/metric export (same granularity + buckets params and validation as the trend endpoint)" }, { "name": "granularity", "in": "query", "required": false, "schema": { "type": "string", "enum": ["day", "week", "month"], "default": "week" }, "description": "trend=1: bucket size (default week); non-trend intake export: with bucket_start, the bucket size (both or neither, no default on this path)" }, { "name": "bucket_start", "in": "query", "required": false, "schema": { "type": "string", "format": "date" }, "description": "non-trend intake export only: first day of the bucket (YYYY-MM-DD), with granularity; ignored on non-intake/grouped widgets and on the trend path" }, { "name": "buckets", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 52, "default": 12 }, "description": "trend=1 only: number of consecutive periods ending at the current period (default 12)" } ],
        "responses": { "200": { "description": "CSV export", "content": { "text/csv": { "schema": { "type": "string" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey", "in": "cookie", "name": "glance_session",
        "description": "Session cookie set by POST /api/v1/auth/otp/verify or the OAuth callback. HttpOnly."
      },
      "apiToken": {
        "type": "http", "scheme": "bearer",
        "description": "Personal API token minted via POST /api/v1/tokens (prefix gl_). Bearer <redacted> that do not start with gl_ are ignored by the middleware. Scopes: read (GETs), write (implies read)."
      },
      "feedToken": {
        "type": "apiKey", "in": "query", "name": "token",
        "description": "Per-user calendar feed token minted via POST /api/v1/me/calendar-token (prefix glcal_). Authenticates the calendar.ics subscription feeds only; not honored on session/API-token routes."
      }
    },
    "parameters": {
      "Slug": { "name": "slug", "in": "path", "required": true, "schema": { "type": "string" }, "description": "Workspace slug" },
      "Identifier": { "name": "identifier", "in": "path", "required": true, "schema": { "type": "string" }, "description": "Project identifier (uppercased short key)" },
      "Uuid": { "name": "uuid", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" }, "description": "Issue id (uuid)" },
      "IdempotencyKey": { "name": "Idempotency-Key", "in": "header", "schema": { "type": "string" }, "description": "Replay-safe: a retried request with the same key returns the stored response byte-identical instead of executing again (supported on issue create, comment create, bulk update/delete)." }
    },
    "responses": {
      "BadRequest": { "description": "Invalid request", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Unauthorized": { "description": "Missing or invalid auth", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Forbidden": { "description": "Authenticated but not allowed", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "NotFound": { "description": "Not found", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Conflict": { "description": "Conflicting state", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "RateLimited": { "description": "Too many requests", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "PayloadTooLarge": { "description": "Request body exceeds the size limit", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "BadGateway": { "description": "Upstream service error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "properties": {
          "code": { "type": "string", "description": "Machine-readable error code, e.g. bad_request, not_found, rate_limited" },
          "message": { "type": "string" },
          "details": { "type": "object", "description": "Optional structured detail" }
        }
      },
      "Ok": { "type": "object", "properties": { "ok": { "type": "boolean", "example": true } } },
      "Dashboard": {
        "type": "object",
        "description": "A workspace-scoped widget canvas (C81T0). visibility public (default) is visible to all workspace members; private is visible only to the creator.",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "workspace_id": { "type": "string", "format": "uuid" },
          "name": { "type": "string" },
          "description": { "type": "string", "nullable": true },
          "visibility": { "type": "string", "enum": ["public", "private"] },
          "created_by": { "type": "string", "format": "uuid" },
          "created_by_name": { "type": "string", "description": "Creator display name (name, else email)" },
          "created_at": { "type": "string", "format": "date-time" },
          "updated_at": { "type": "string", "format": "date-time" },
          "widgets": { "type": "array", "items": { "$ref": "#/components/schemas/DashboardWidget" }, "description": "Present on the detail read only (config only - fetch data per widget); always an array, never null" },
          "shared_with_me": { "type": "boolean", "description": "True when the caller holds a share row on someone else's dashboard" },
          "my_access": { "type": "string", "enum": ["owner", "view", "edit"], "description": "The caller's effective access: drives frontend affordance gating" },
          "shared": { "type": "boolean", "description": "True on dashboards the caller owns that have at least one share (feeds the Shared tab)" }
        }
      },
      "DashboardWidget": {
        "type": "object",
        "description": "One configured visualization on a dashboard canvas.",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "dashboard_id": { "type": "string", "format": "uuid" },
          "title": { "type": "string" },
          "widget_type": { "type": "string", "enum": ["bar", "line", "area", "donut", "pie", "number", "smart_counter", "smart_gauge", "table_2d", "intake_breakdown", "work_items_table", "assigned_to_me"] },
          "config": { "$ref": "#/components/schemas/WidgetConfig" },
          "grid_x": { "type": "integer", "description": "12-column grid units; clamped to non-negative" },
          "grid_y": { "type": "integer", "description": "12-column grid units; clamped to non-negative" },
          "grid_w": { "type": "integer", "description": "12-column grid units; clamped to 1..12" },
          "grid_h": { "type": "integer", "description": "12-column grid units; clamped to 1..12" },
          "created_at": { "type": "string", "format": "date-time" },
          "updated_at": { "type": "string", "format": "date-time" }
        }
      },
      "WidgetConfig": {
        "type": "object",
        "description": "Widget configuration, validated strictly at write time per widget type: group_by is required for chart and phase-2 grouped types; keys meaningless for the type (e.g. max_rows on bar, columns on donut) are 400; unknown keys are rejected.",
        "properties": {
          "group_by": { "type": "string", "enum": ["state", "priority", "assignee", "label", "state_group", "project", "created_by"], "description": "Required for chart and phase-2 grouped types; ignored for number, intake_breakdown, and the phase-3 row-list types" },
          "metric": { "type": "string", "enum": ["count", "estimate_points"], "description": "count|estimate_points for smart_counter|smart_gauge (default count); reserved to count for phase-1 charts and number; accepted-but-ignored for table_2d (fixed to count), intake_breakdown, and the phase-3 row-list types (fixed to item rows)" },
          "filters": {
            "type": "object",
            "description": "ANDed together; each list is an OR within its dimension",
            "properties": {
              "assignees": { "type": "array", "items": { "type": "string", "format": "uuid" } },
              "priorities": { "type": "array", "items": { "type": "integer", "minimum": 0, "maximum": 4 } },
              "states": { "type": "array", "items": { "type": "string", "format": "uuid" } },
              "labels": { "type": "array", "items": { "type": "string", "format": "uuid" } }
            }
          },
          "project_ids": { "type": "array", "items": { "type": "string", "format": "uuid" }, "description": "Scope to these projects; empty/absent = every non-archived project of the workspace; ignored for intake_breakdown" },
          "max_rows": { "type": "integer", "minimum": 1, "maximum": 100, "default": 10, "description": "smart_counter|smart_gauge|table_2d|work_items_table|assigned_to_me only: groups/rows per page; rejected on other types" },
          "columns": { "type": "array", "items": { "type": "string", "enum": ["id", "title", "state", "priority", "assignee", "labels", "project"] }, "description": "work_items_table|assigned_to_me only: the rendered columns in order (default: all seven; unknown columns are 400; the row payload always carries the full row)" },
          "sort_by": { "type": "string", "enum": ["id", "title", "state", "priority", "assignee", "labels", "project"], "default": "state", "description": "work_items_table|assigned_to_me only: must be one of the configured columns (default state)" },
          "sort_dir": { "type": "string", "enum": ["asc", "desc"], "default": "desc", "description": "work_items_table|assigned_to_me only: sort direction (default desc)" },
          "visualization": { "type": "string", "enum": ["grid", "table"], "default": "grid", "description": "smart_counter only: tile grid or table render" },
          "gauge_color": { "type": "string", "default": "#3b82f6", "description": "smart_gauge only: #rrggbb arc color" },
          "show_percentage": { "type": "boolean", "default": true, "description": "smart_gauge only: render the % label" },
          "view": { "type": "string", "enum": ["grid", "table"], "default": "grid", "description": "intake_breakdown only: tile grid or table render" }
        }
      },
      "WidgetDataGroup": {
        "type": "object",
        "description": "One bucket of a grouped widget. The key IS the human label the frontend renders.",
        "properties": {
          "key": { "type": "string", "description": "Human label: state name, priority label (None/Low/Medium/High/Urgent), assignee display name, label name, state-group display name, project name, creator display name, or the synthetic \"Unassigned\" / \"No label\" buckets" },
          "label": { "type": "string", "description": "Same as key" },
          "value": { "type": "integer", "description": "Issue count; summed estimate points when metric=estimate_points" },
          "completed": { "type": "integer", "description": "smart_gauge only: the completed share of the group (issues in a completed-group state, or their estimate points)" },
          "percentage": { "type": "number", "description": "smart_gauge only: 100*completed/value; 0 when value is 0" }
        }
      },
      "WidgetData": {
        "type": "object",
        "description": "Live widget recompute: groups for chart and phase-2 grouped types, value for number widgets, intake for intake_breakdown widgets, rows for the phase-3 row-list types (work_items_table, assigned_to_me).",
        "properties": {
          "groups": { "type": "array", "items": { "$ref": "#/components/schemas/WidgetDataGroup" }, "description": "Present for chart and phase-2 grouped types (absent when a paginated page is empty); absent for number and intake_breakdown" },
          "value": { "type": "integer", "description": "Present only for number widgets" },
          "page": { "type": "integer", "description": "smart_counter|smart_gauge|table_2d|work_items_table|assigned_to_me only: the returned page (?page=, default 1)" },
          "max_rows": { "type": "integer", "description": "smart_counter|smart_gauge|table_2d|work_items_table|assigned_to_me only: groups/rows per page (config, 1-100, default 10)" },
          "total_groups": { "type": "integer", "description": "smart_counter|smart_gauge|table_2d only: total groups before pagination" },
          "rows": { "type": "array", "items": { "$ref": "#/components/schemas/WidgetRowItem" }, "description": "Present only for work_items_table|assigned_to_me: the canonical work-item rows of the requested page, in the config sort order (the full row is always returned; the configured columns only decide what the frontend renders)" },
          "total": { "type": "integer", "description": "Present only for work_items_table|assigned_to_me: total rows before pagination" },
          "intake": { "$ref": "#/components/schemas/IntakeBreakdown", "description": "Present only for intake_breakdown widgets" }
        }
      },
      "WidgetRowItem": {
        "type": "object",
        "description": "One canonical work-item row of the phase-3 row-list widgets, the drill-down endpoint, and the row CSV export. title = issues.name; state = the state NAME (the human label); state_group = the state-group SLUG; assignee = the single display assignee {id, name} (null when unassigned); labels = the canonical [{id, name, color}]; project = {id, name}.",
        "properties": {
          "id": { "type": "string", "format": "uuid", "description": "The work-item id" },
          "title": { "type": "string", "description": "The work-item name (issues.name)" },
          "state": { "type": "string", "description": "The state NAME (the human label, same string as the state group key)" },
          "state_group": { "type": "string", "enum": ["triage", "backlog", "unstarted", "started", "completed", "cancelled"], "description": "The state-group slug" },
          "priority": { "type": "integer", "minimum": 0, "maximum": 4, "description": "issues.priority: 0 None, 1 Low, 2 Medium, 3 High, 4 Urgent" },
          "assignee": { "type": "object", "nullable": true, "properties": { "id": { "type": "string", "format": "uuid" }, "name": { "type": "string" } }, "description": "The single display assignee {id, name} (first by display-name order); null when unassigned" },
          "labels": { "type": "array", "items": { "type": "object", "properties": { "id": { "type": "string", "format": "uuid" }, "name": { "type": "string" }, "color": { "type": "string" } } }, "description": "The canonical [{id, name, color}] label shape; [] when unlabeled" },
          "project": { "type": "object", "properties": { "id": { "type": "string", "format": "uuid" }, "name": { "type": "string" } }, "description": "The {id, name} project ref" }
        }
      },
      "WidgetDrilldown": {
        "type": "object",
        "description": "The items behind one chart segment: the widget's base filters ANDed with the segment's group filter. For smart_counter|smart_gauge the metric (count vs estimate-points) changes the displayed group value, NOT the item set - the same items are listed for both metrics.",
        "properties": {
          "items": { "type": "array", "items": { "$ref": "#/components/schemas/WidgetRowItem" }, "description": "The segment's items on the requested page, most-recently-updated first" },
          "page": { "type": "integer", "description": "The returned page (?page=, default 1)" },
          "per_page": { "type": "integer", "description": "Rows per page (the widget's max_rows, 1-100, default 10)" },
          "total": { "type": "integer", "description": "The segment's item count before pagination" },
          "group_label": { "type": "string", "description": "The human group key the caller drilled into" },
          "group_by": { "type": "string", "enum": ["state", "priority", "assignee", "label", "state_group", "project", "created_by"], "description": "The widget's grouping dimension" }
        }
      },
      "IntakeDrilldownItem": {
        "type": "object",
        "description": "One intake row behind an intake_breakdown tile. Field names reuse the intake-list payload (id = the intake_issues row id, issue_id, status/status_name, snoozed_till, duplicate_to_id, created_at) plus title and the {id, name} project ref from the WidgetRowItem vocabulary, plus source. status/status_name carry the EFFECTIVE status (a resurfaced snoozed row reads pending).",
        "properties": {
          "id": { "type": "string", "format": "uuid", "description": "The intake_issues row id (distinct from issue_id)" },
          "issue_id": { "type": "string", "format": "uuid", "description": "The issue the intake row triages" },
          "title": { "type": "string", "description": "The issue's name" },
