          "parent_id": { "type": "string", "format": "uuid" },
          "sort_order": { "type": "number" },
          "start_date": { "type": "string", "format": "date" },
          "target_date": { "type": "string", "format": "date" },
          "estimate_point_id": { "type": "string", "format": "uuid" },
          "is_draft": { "type": "boolean" },
          "intake": { "type": "boolean", "description": "Opt the new issue into the intake inbox as pending (default false: direct-to-backlog)" }
        }
      },
      "IssuePatch": {
        "type": "object",
        "description": "Partial update. Plain fields: omitted = untouched. description/parent_id/start_date/target_date/estimate_point_id are tri-state: omitted = untouched, explicit null = clear, value = assign.",
        "properties": {
          "name": { "type": "string" },
          "priority": { "type": "integer", "minimum": 0, "maximum": 4 },
          "state_id": { "type": "string", "format": "uuid" },
