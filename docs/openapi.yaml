        "responses": { "200": { "description": "Shared resource", "content": { "application/json": { "schema": { "type": "object" } } } }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey", "in": "cookie", "name": "glance_session",
        "description": "Session cookie set by POST /api/v1/auth/otp/verify or the OAuth callback. HttpOnly."
      },
      "apiToken": {
        "type": "http", "scheme": "bearer",
        "description": "Personal API token minted via POST /api/v1/tokens (prefix gl_). Bearer <redacted> that do not start with gl_ are ignored by the middleware. Scopes: read (GETs), write (implies read)."
      }
    },
    "parameters": {
      "Slug": { "name": "slug", "in": "path", "required": true, "schema": { "type": "string" }, "description": "Workspace slug" },
      "Identifier": { "name": "identifier", "in": "path", "required": true, "schema": { "type": "string" }, "description": "Project identifier (uppercased short key)" },
      "Uuid": { "name": "uuid", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" }, "description": "Issue id (uuid)" },
      "IdempotencyKey": { "name": "Idempotency-Key", "in": "header", "schema": { "type": "string" }, "description": "Replay-safe: a retried request with the same key returns the stored response byte-identical instead of executing again (supported on issue create, comment create, bulk update/delete)." }
    },
    "responses": {
      "BadRequest": { "description": "Invalid request", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Unauthorized": { "description": "Missing or invalid auth", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Forbidden": { "description": "Authenticated but not allowed", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "NotFound": { "description": "Not found", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Conflict": { "description": "Conflicting state", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "RateLimited": { "description": "Too many requests", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "PayloadTooLarge": { "description": "Request body exceeds the size limit", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "BadGateway": { "description": "Upstream service error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "properties": {
          "code": { "type": "string", "description": "Machine-readable error code, e.g. bad_request, not_found, rate_limited" },
          "message": { "type": "string" },
          "details": { "type": "object", "description": "Optional structured detail" }
        }
      },
      "Ok": { "type": "object", "properties": { "ok": { "type": "boolean", "example": true } } },
      "SimilarIssue": {
        "type": "object",
        "description": "One possible-duplicate hit from GET .../issues/similar (C8T7).",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "display_id": { "type": "string", "description": "e.g. ENG-7" },
          "name": { "type": "string" },
          "state": { "type": "string", "description": "Human state name, e.g. Backlog" },
          "similarity": { "type": "number", "format": "double", "description": "pg_trgm similarity to ?q=, always > 0.3" }
        }
      },
      "User": {
        "type": "object",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "email": { "type": "string", "format": "email" },
          "name": { "type": "string" },
          "role": { "type": "string", "description": "Server role (admin or member)" },
          "created_at": { "type": "string", "format": "date-time" }
        }
      },
      "Session": {
        "type": "object",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "user_agent": { "type": "string" },
          "ip": { "type": "string" },
          "created_at": { "type": "string", "format": "date-time" },
          "last_seen_at": { "type": "string", "format": "date-time" },
          "current": { "type": "boolean", "description": "True when this row is the caller's own session" }
        }
      },
      "Token": {
        "type": "object",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "name": { "type": "string" },
          "scopes": { "type": "array", "items": { "type": "string", "enum": ["read", "write"] } },
          "expires_at": { "type": "string", "format": "date-time", "nullable": true },
          "last_used_at": { "type": "string", "format": "date-time", "nullable": true },
          "created_at": { "type": "string", "format": "date-time" }
        }
      },
      "CreatedToken": {
        "allOf": [ { "$ref": "#/components/schemas/Token" } ],
