    "/api/v1/workspaces/{slug}/projects/{identifier}/issues/{uuid}/convert": {
      "post": {
        "tags": ["issues"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Convert an issue to a sub-issue (or back to a standalone issue)",
        "description": "Demotes the issue to a sub-issue of the given parent, or promotes it back to a standalone issue when parent_uuid is null. Demote requires the parent to be a live issue in the same project that is not itself a sub-issue (max depth 1); the issue must have no sub-issues of its own. 400 when the issue has sub-issues, the parent is itself a sub-issue, or the parent is in another project; 409 on self-parent or a parent assignment that would close a cycle; 404 on an unknown issue or parent. 200 with {\"converted\": bool, \"issue\": {...}} — converted=false when already in the target state. Writes `_converted` activity entries on the issue and (on demote) the parent, plus the uniform parent_id field entry. Member (15)+.",
