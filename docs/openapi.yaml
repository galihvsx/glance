        "responses": { "200": { "description": "Schedules (never null)", "content": { "application/json": { "schema": { "type": "array", "items": { "$ref": "#/components/schemas/RecurringSchedule" } } } } }, "404": { "$ref": "#/components/responses/NotFound" } }
      },
      "post": {
        "tags": ["recurring"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Create a recurring issue schedule",
        "description": "Member (15)+. A schedule is a cron-like recipe: every occurrence the ticker creates one issue from title_template/description_template rendered with the run time. All times are UTC in v1; hour is 0..23 UTC; starts_on/ends_on are YYYY-MM-DD dates. A schedule whose ends_on already exhausts it (no first run) is rejected with 400.",
        "parameters": [ { "$ref": "#/components/parameters/Slug" }, { "$ref": "#/components/parameters/Identifier" } ],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RecurringScheduleCreate" } } } },
        "responses": { "201": { "description": "Created schedule", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RecurringSchedule" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/workspaces/{slug}/projects/{identifier}/schedules/{scheduleID}": {
      "get": {
        "tags": ["recurring"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Get a recurring schedule",
        "parameters": [ { "$ref": "#/components/parameters/Slug" }, { "$ref": "#/components/parameters/Identifier" }, { "name": "scheduleID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } } ],
        "responses": { "200": { "description": "Schedule", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RecurringSchedule" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "404": { "$ref": "#/components/responses/NotFound" } }
      },
      "patch": {
        "tags": ["recurring"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Update a recurring schedule",
        "description": "Member (15)+. Partial semantics with tri-state for the nullable fields (day_of_month, ends_on, description_template, state_id): an absent key is untouched, explicit null clears it, a value sets it. Cadence changes (frequency/interval/days/hour/starts/ends) recompute next_run_at. An empty patch is a 400.",
        "parameters": [ { "$ref": "#/components/parameters/Slug" }, { "$ref": "#/components/parameters/Identifier" }, { "name": "scheduleID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } } ],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "properties": { "name": { "type": "string" }, "active": { "type": "boolean" }, "frequency": { "type": "string", "enum": ["daily", "weekly", "monthly"] }, "interval": { "type": "integer", "minimum": 1 }, "days_of_week": { "type": "array", "items": { "type": "integer", "minimum": 0, "maximum": 6 }, "description": "0=Sunday..6=Saturday; weekly only" }, "day_of_month": { "type": "integer", "minimum": 1, "maximum": 31, "nullable": true, "description": "monthly only" }, "hour": { "type": "integer", "minimum": 0, "maximum": 23, "description": "UTC hour of day" }, "starts_on": { "type": "string", "format": "date" }, "ends_on": { "type": "string", "format": "date", "nullable": true }, "title_template": { "type": "string" }, "description_template": { "type": "string", "nullable": true }, "state_id": { "type": "string", "format": "uuid", "nullable": true, "description": "null = project backlog state at run time" }, "priority": { "type": "integer", "minimum": 0, "maximum": 4 }, "label_ids": { "type": "array", "items": { "type": "string", "format": "uuid" } }, "assignee_ids": { "type": "array", "items": { "type": "string", "format": "uuid" } } } } } } },
        "responses": { "200": { "description": "Updated schedule", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RecurringSchedule" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      },
      "delete": {
        "tags": ["recurring"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Delete a recurring schedule",
