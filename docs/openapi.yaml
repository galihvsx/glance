        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["workspace_slug", "project_identifier", "issue_uuid"], "properties": { "workspace_slug": { "type": "string" }, "project_identifier": { "type": "string" }, "issue_uuid": { "type": "string", "format": "uuid" }, "max": { "type": "integer", "minimum": 1, "maximum": 10 } } } } } },
        "responses": {"200": {"description": "Sub-issue suggestions", "content": {"application/json": {"schema": {"type": "object", "properties": {"suggestions": {"type": "array", "items": {"type": "object", "required": ["title"], "properties": {"title": {"type": "string"}, "description": {"type": "string"}}}}}}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "404": {"$ref": "#/components/responses/NotFound"}, "502": {"$ref": "#/components/responses/BadGateway"}, "503": {"description": "AI not configured", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}
      }
    },
    "/api/v1/admin/stats": {
      "get": {
        "tags": ["admin"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Instance stats",
        "description": "Requires the server admin role (in addition to auth).",
        "responses": { "200": { "description": "Stats", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AdminStats" } } } }, "403": { "$ref": "#/components/responses/Forbidden" } }
      }
    },
    "/api/v1/admin/users": {
      "get": {
        "tags": ["admin"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "List all users",
        "description": "Requires the server admin role. Paginated user directory, oldest first (created_at, id), with admin flags and workspace membership counts. Pagination follows the shared page/per_page contract: page defaults to 1, per_page defaults to 25; page < 1 or per_page outside 1-100 is rejected with 400, never silently clamped.",
        "parameters": [
          { "name": "page", "in": "query", "schema": { "type": "integer", "default": 1, "minimum": 1 }, "description": "Page number, 1-based. Non-integer or < 1 → 400." },
          { "name": "per_page", "in": "query", "schema": { "type": "integer", "default": 25, "minimum": 1, "maximum": 100 }, "description": "Page size. Outside 1-100 → 400, never silently clamped." }
        ],
        "responses": { "200": { "description": "Paginated users", "content": { "application/json": { "schema": { "type": "object", "required": ["items", "total", "page", "per_page"], "properties": { "items": { "type": "array", "items": { "$ref": "#/components/schemas/AdminUser" } }, "total": { "type": "integer", "description": "Total user count across all pages" }, "page": { "type": "integer" }, "per_page": { "type": "integer" } } } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" } }
      }
    },
    "/api/v1/admin/users/{id}": {
      "patch": {
        "tags": ["admin"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Set a user's instance-admin flag",
        "description": "Requires the server admin role. Sets (or clears) the target user's instance-admin flag — the only field this endpoint changes; name and workspace roles are NOT settable here. Missing is_admin → 400. Demoting your own account → 409 (self-demotion). Demoting the last remaining admin → 409 (the instance must always have at least one admin). Unknown user → 404; malformed id → 400.",
        "parameters": [ { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } } ],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["is_admin"], "properties": { "is_admin": { "type": "boolean", "description": "true promotes to instance admin, false demotes" } } } } } },
        "responses": { "200": { "description": "Admin flag updated", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Ok" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "409": { "$ref": "#/components/responses/Conflict" } }
      }
    },
    "/api/v1/admin/users/{id}/deactivate": {
      "post": {
        "tags": ["admin"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Deactivate a user",
        "description": "Requires the server admin role. Disables the account and revokes all its live sessions immediately. Deactivating an already-deactivated account is a 200 no-op (idempotent). Self-deactivation → 409. Unknown user → 404; malformed id → 400.",
        "parameters": [ { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } } ],
        "responses": { "200": { "description": "Deactivated", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Ok" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "409": { "$ref": "#/components/responses/Conflict" } }
      }
    },
    "/api/v1/admin/users/{id}/reactivate": {
      "post": {
        "tags": ["admin"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Reactivate a user",
        "description": "Requires the server admin role. Re-enables a deactivated account. Reactivating an already-active account is a 200 no-op (idempotent). Sessions revoked at deactivation stay revoked — the user logs in fresh. There is no self-reactivation guard (unlike deactivate, which 409s on self): reactivating your own account is allowed. Unknown user → 404; malformed id → 400.",
        "parameters": [ { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } } ],
        "responses": { "200": { "description": "Reactivated", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Ok" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/admin/workspaces": {
      "get": {
        "tags": ["admin"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "List all workspaces (instance-wide)",
        "description": "Requires the server admin role.",
        "responses": { "200": { "description": "Workspaces", "content": { "application/json": { "schema": { "type": "object", "properties": { "workspaces": { "type": "array", "items": { "$ref": "#/components/schemas/Workspace" } } } } } } }, "403": { "$ref": "#/components/responses/Forbidden" } }
      }
    },
    "/api/v1/admin/workspaces/{id}": {
      "delete": {
        "tags": ["admin"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Delete any workspace (instance-wide)",
        "description": "Requires the server admin role.",
        "parameters": [ { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } } ],
        "responses": { "204": { "description": "Deleted" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/admin/audit-log": {
      "get": {
        "tags": ["admin"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "List the admin audit log",
        "description": "Requires the server admin role. Append-only record of admin mutations (user deactivate/reactivate/role change, workspace delete), newest first. Exact-match filters: action (e.g. user.deactivated), actor_id (uuid), entity_type (user or workspace).",
        "parameters": [
          { "name": "page", "in": "query", "schema": { "type": "integer", "default": 1 } },
          { "name": "per_page", "in": "query", "schema": { "type": "integer", "default": 25 } },
          { "name": "action", "in": "query", "schema": { "type": "string" } },
          { "name": "actor_id", "in": "query", "schema": { "type": "string", "format": "uuid" } },
          { "name": "entity_type", "in": "query", "schema": { "type": "string" } }
        ],
        "responses": { "200": { "description": "Paginated audit entries", "content": { "application/json": { "schema": { "type": "object" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" } }
      }
    },
    "/api/v1/admin/backups": {
      "get": {
        "tags": ["admin"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "List scheduled backup runs",
        "description": "Requires the server admin role. Backup run history, newest first, paginated. Optional workspace_slug filter. The response also carries the schedule/retention config (enabled, interval, dir, retention).",
        "parameters": [
          { "name": "page", "in": "query", "schema": { "type": "integer", "default": 1 } },
          { "name": "per_page", "in": "query", "schema": { "type": "integer", "default": 25 } },
          { "name": "workspace_slug", "in": "query", "schema": { "type": "string" } }
        ],
        "responses": { "200": { "description": "Paginated backup runs plus schedule config", "content": { "application/json": { "schema": { "type": "object" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" } }
      }
    },
    "/api/v1/admin/backups/run": {
      "post": {
        "tags": ["admin"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Trigger a backup now",
        "description": "Requires the server admin role. Streams a gzipped glance-export/1 archive per workspace to the backup dir, records the run, verifies integrity, and prunes retention. Optional JSON body {workspace_slug} backs up one workspace; an empty body backs up every workspace. Works even when the scheduled backup is disabled.",
        "requestBody": { "required": false, "content": { "application/json": { "schema": { "type": "object", "properties": { "workspace_slug": { "type": "string" } } } } } },
        "responses": { "200": { "description": "Recorded backup runs", "content": { "application/json": { "schema": { "type": "object" } } } }, "207": { "description": "Partial failure: some workspaces backed up, some failed (error detail in body)", "content": { "application/json": { "schema": { "type": "object" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/public/s/{token}": {
      "get": {
        "tags": ["issues"], "security": [],
        "summary": "Open a public share link",
        "description": "No auth — the token is the capability. Renders the shared issue or page.",
        "parameters": [ { "name": "token", "in": "path", "required": true, "schema": { "type": "string" } } ],
        "responses": { "200": { "description": "Shared resource", "content": { "application/json": { "schema": { "type": "object" } } } }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey", "in": "cookie", "name": "glance_session",
        "description": "Session cookie set by POST /api/v1/auth/otp/verify or the OAuth callback. HttpOnly."
      },
      "apiToken": {
        "type": "http", "scheme": "bearer",
        "description": "Personal API token minted via POST /api/v1/tokens (prefix gl_). Bearer <redacted> that do not start with gl_ are ignored by the middleware. Scopes: read (GETs), write (implies read)."
      },
      "feedToken": {
        "type": "apiKey", "in": "query", "name": "token",
        "description": "Per-user calendar feed token minted via POST /api/v1/me/calendar-token (prefix glcal_). Authenticates the calendar.ics subscription feeds only; not honored on session/API-token routes."
      }
    },
    "parameters": {
      "Slug": { "name": "slug", "in": "path", "required": true, "schema": { "type": "string" }, "description": "Workspace slug" },
      "Identifier": { "name": "identifier", "in": "path", "required": true, "schema": { "type": "string" }, "description": "Project identifier (uppercased short key)" },
      "Uuid": { "name": "uuid", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" }, "description": "Issue id (uuid)" },
      "IdempotencyKey": { "name": "Idempotency-Key", "in": "header", "schema": { "type": "string" }, "description": "Replay-safe: a retried request with the same key returns the stored response byte-identical instead of executing again (supported on issue create, comment create, bulk update/delete)." }
    },
    "responses": {
      "BadRequest": { "description": "Invalid request", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Unauthorized": { "description": "Missing or invalid auth", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Forbidden": { "description": "Authenticated but not allowed", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "NotFound": { "description": "Not found", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Conflict": { "description": "Conflicting state", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "RateLimited": { "description": "Too many requests", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "PayloadTooLarge": { "description": "Request body exceeds the size limit", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "BadGateway": { "description": "Upstream service error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "properties": {
          "code": { "type": "string", "description": "Machine-readable error code, e.g. bad_request, not_found, rate_limited" },
          "message": { "type": "string" },
          "details": { "type": "object", "description": "Optional structured detail" }
        }
      },
      "Ok": { "type": "object", "properties": { "ok": { "type": "boolean", "example": true } } },
      "RecurringSchedule": {
        "type": "object",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "workspace_id": { "type": "string", "format": "uuid" },
          "project_id": { "type": "string", "format": "uuid" },
          "name": { "type": "string" },
          "active": { "type": "boolean" },
          "frequency": { "type": "string", "enum": ["daily", "weekly", "monthly"] },
          "interval": { "type": "integer", "minimum": 1 },
          "days_of_week": { "type": "array", "items": { "type": "integer", "minimum": 0, "maximum": 6 }, "description": "0=Sunday..6=Saturday; weekly only" },
          "day_of_month": { "type": "integer", "minimum": 1, "maximum": 31, "nullable": true, "description": "monthly only" },
          "hour": { "type": "integer", "minimum": 0, "maximum": 23, "description": "UTC hour of day (v1 runs on UTC)" },
          "starts_on": { "type": "string", "format": "date" },
          "ends_on": { "type": "string", "format": "date", "nullable": true },
          "next_run_at": { "type": "string", "format": "date-time" },
          "last_run_at": { "type": "string", "format": "date-time", "nullable": true },
          "run_count": { "type": "integer" },
          "title_template": { "type": "string" },
          "description_template": { "type": "string", "nullable": true },
          "state_id": { "type": "string", "format": "uuid", "nullable": true, "description": "null = the project's backlog state at run time" },
          "priority": { "type": "integer", "minimum": 0, "maximum": 4 },
          "label_ids": { "type": "array", "items": { "type": "string", "format": "uuid" } },
          "assignee_ids": { "type": "array", "items": { "type": "string", "format": "uuid" } },
          "created_by": { "type": "string", "format": "uuid", "nullable": true },
          "created_at": { "type": "string", "format": "date-time" },
          "updated_at": { "type": "string", "format": "date-time" }
        }
      },
      "RecurringScheduleCreate": {
        "type": "object",
        "required": ["name", "frequency", "starts_on", "title_template"],
        "properties": {
          "name": { "type": "string" },
          "active": { "type": "boolean", "default": true, "description": "false creates the schedule paused" },
          "frequency": { "type": "string", "enum": ["daily", "weekly", "monthly"] },
          "interval": { "type": "integer", "minimum": 1, "default": 1, "description": "every N days/weeks/months" },
          "days_of_week": { "type": "array", "items": { "type": "integer", "minimum": 0, "maximum": 6 }, "description": "required for weekly; 0=Sunday..6=Saturday" },
          "day_of_month": { "type": "integer", "minimum": 1, "maximum": 31, "description": "required for monthly; clamped to the month length at run time (31 in February runs on Feb 28/29)" },
          "hour": { "type": "integer", "minimum": 0, "maximum": 23, "default": 9, "description": "UTC hour of day (v1 runs on UTC)" },
          "starts_on": { "type": "string", "format": "date" },
          "ends_on": { "type": "string", "format": "date", "description": "a schedule with no future run under ends_on is rejected" },
          "title_template": { "type": "string", "description": "supports {{date}} (YYYY-MM-DD) and {{datetime}} (RFC3339) of the run time" },
          "description_template": { "type": "string", "description": "same tokens as title_template" },
          "state_id": { "type": "string", "format": "uuid", "description": "omit for the project's backlog state at run time" },
          "priority": { "type": "integer", "minimum": 0, "maximum": 4, "default": 0 },
          "label_ids": { "type": "array", "items": { "type": "string", "format": "uuid" } },
          "assignee_ids": { "type": "array", "items": { "type": "string", "format": "uuid" } }
        }
      },
      "Initiative": {
        "type": "object",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "workspace_id": { "type": "string", "format": "uuid" },
          "name": { "type": "string" },
          "description": { "type": "string", "nullable": true },
          "status": { "type": "string", "enum": ["active", "completed", "archived"] },
          "created_by": { "type": "string", "format": "uuid", "nullable": true },
          "project_count": { "type": "integer" },
          "created_at": { "type": "string", "format": "date-time" },
          "updated_at": { "type": "string", "format": "date-time" }
        }
      },
      "InitiativeProject": {
        "type": "object",
        "properties": {
          "project_id": { "type": "string", "format": "uuid" },
          "project_name": { "type": "string" },
          "added_at": { "type": "string", "format": "date-time" }
        }
      },
      "InitiativeRollup": {
        "type": "object",
        "properties": {
          "initiative_id": { "type": "string", "format": "uuid" },
          "total": { "type": "integer", "description": "Live (non-deleted) issues across all member projects" },
          "done_count": { "type": "integer", "description": "Issues in a done state group (completed/cancelled)" },
          "completion_pct": { "type": "number", "description": "done_count / total * 100; 0 when total is 0" },
          "by_group": { "type": "object", "additionalProperties": { "type": "integer" }, "description": "Issue counts by state group (triage/backlog/unstarted/started/completed/cancelled)" },
          "projects": { "type": "array", "items": { "type": "object", "properties": {
            "project_id": { "type": "string", "format": "uuid" },
            "project_name": { "type": "string" },
            "total": { "type": "integer" },
            "done_count": { "type": "integer" },
            "completion_pct": { "type": "number" },
            "by_group": { "type": "object", "additionalProperties": { "type": "integer" } }
          } } }
        }
      },
      "Objective": {
        "type": "object",
        "description": "Workspace-scoped goal. Progress is computed (mean of KR progress, 0 when no KRs), never stored. key_results is populated only by GET .../objectives/{objectiveID}.",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "workspace_id": { "type": "string", "format": "uuid" },
          "title": { "type": "string" },
          "description": { "type": "string", "nullable": true },
          "owner": { "$ref": "#/components/schemas/ActorRef" },
          "start_date": { "type": "string", "format": "date", "nullable": true },
          "target_date": { "type": "string", "format": "date", "nullable": true },
          "status": { "type": "string", "enum": ["active", "completed", "archived"] },
          "progress": { "type": "number", "description": "Mean of KR progress in [0, 1]; 0 when no KRs" },
          "key_result_count": { "type": "integer" },
          "key_results": { "type": "array", "items": { "$ref": "#/components/schemas/KeyResult" } },
          "created_at": { "type": "string", "format": "date-time" },
          "updated_at": { "type": "string", "format": "date-time" }
        }
      },
      "KeyResult": {
        "type": "object",
        "description": "Measurable result under an objective. Metric KR progress = clamp((current-start)/(target-start), 0, 1); issue KR progress = done-group linked issues ÷ linked issues (0 when no links). linked_issues is populated only by GET .../objectives/{objectiveID}, for issue KRs.",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "objective_id": { "type": "string", "format": "uuid" },
          "title": { "type": "string" },
          "kind": { "type": "string", "enum": ["metric", "issue"], "description": "Immutable after create" },
          "unit": { "type": "string", "nullable": true, "description": "Metric KRs only" },
          "start_value": { "type": "number" },
          "target_value": { "type": "number", "description": "Must differ from start_value" },
          "current_value": { "type": "number", "description": "Metric KRs only; ignored for issue KRs" },
          "progress": { "type": "number", "description": "Computed progress in [0, 1]" },
          "linked_issues": { "type": "array", "items": { "$ref": "#/components/schemas/LinkedIssue" } },
          "created_at": { "type": "string", "format": "date-time" },
          "updated_at": { "type": "string", "format": "date-time" }
        }
      },
      "LinkedIssue": {
        "type": "object",
        "description": "A live issue linked to an issue KR.",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "display_id": { "type": "string", "description": "e.g. ENG-7" },
          "title": { "type": "string" },
          "state_group": { "type": "string", "description": "State group (triage/backlog/unstarted/started/completed/cancelled); empty when the issue has no state" }
        }
      },
      "KeyResultCheckin": {
        "type": "object",
        "description": "One append-only check-in entry: a metric KR's current_value moving from previous_value to new_value, with the actor and an optional note. previous_value is null on the seed entry written at KR creation. Author is null when the author's user row was deleted. There is no update/delete path.",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "key_result_id": { "type": "string", "format": "uuid" },
          "author": { "$ref": "#/components/schemas/CheckinAuthor", "nullable": true },
          "previous_value": { "type": "number", "nullable": true, "description": "Null on the seed entry written at KR creation" },
          "new_value": { "type": "number" },
          "note": { "type": "string", "nullable": true },
          "created_at": { "type": "string", "format": "date-time" }
        }
      },
      "CheckinAuthor": {
        "type": "object",
        "description": "Author of a check-in entry: id + display name (users.name falling back to users.email).",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "display_name": { "type": "string" }
        }
      },
      "ActorRef": {
        "type": "object",
        "description": "Denormalized actor embedded in responses (id, name, email).",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "name": { "type": "string", "nullable": true },
          "email": { "type": "string", "format": "email" }
        }
      },
      "SimilarIssue": {
        "type": "object",
        "description": "One possible-duplicate hit from GET .../issues/similar (C8T7).",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
