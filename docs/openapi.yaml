          { "name": "before", "in": "query", "description": "Opaque cursor for the next page (previous page's next_cursor).", "schema": { "type": "string" } },
          { "name": "types", "in": "query", "description": "Comma-separated activity field names to include (e.g. \"state_id,priority\").", "schema": { "type": "string" } },
          { "name": "actor", "in": "query", "description": "Workspace member UUID: only that member\u2019s activity rows. A malformed UUID is 400; an unknown member UUID is 404. Cursor pagination works with the filter.", "schema": { "type": "string", "format": "uuid" } }
        ],
        "responses": { "200": { "description": "Workspace activity entries plus the next-page cursor", "content": { "application/json": { "schema": { "type": "object", "properties": { "activity": { "type": "array", "items": { "$ref": "#/components/schemas/WorkspaceActivityEntry" } }, "next_cursor": { "type": "string", "nullable": true, "description": "Opaque cursor for the next page; null when the feed is exhausted." } } } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
