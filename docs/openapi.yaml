        "description": "The issue_activities field-level audit rows aggregated across every project of the workspace the caller is a member (15)+ of, newest first. Member (15)+; guests get 403; a bad slug or non-member caller gets 404. `before` is the opaque cursor from a previous page's `next_cursor` (rows strictly before it); `types` is a comma-separated list of activity field names (e.g. \"state_id,priority\", \"_created\") to filter by; `actor` is a workspace member\u2019s UUID, filtering the feed to that member\u2019s rows (a malformed UUID is 400; a UUID matching no member of the workspace is 404). `next_cursor` is null when the feed is exhausted.",
