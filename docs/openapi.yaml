        "summary": "Atomically set fields on many issues",
        "description": "Applies ONE set to many issues in a single fully-atomic transaction — any unknown, deleted, cross-project, or malformed id, or any invalid set field, aborts the whole batch (no partial application). 200 with {updated, issue_ids}. Member (15)+. The blocker guard applies per issue: a move into a completed state with open blockers aborts the batch with 409 code open_blockers unless set.ignore_blockers=true.",
        "parameters": [ { "$ref": "#/components/parameters/Slug" }, { "$ref": "#/components/parameters/Identifier" } ],
