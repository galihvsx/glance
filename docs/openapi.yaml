        "properties": {
          "issues": { "type": "array", "items": { "type": "object", "properties": {
            "identifier": { "type": "string", "description": "Linear issue identifier, e.g. ENG-123" },
            "title": { "type": "string" },
            "state": { "type": "string", "description": "Matched glance state name, or the Linear state name when new" },
            "priority": { "type": "integer", "description": "0=none 1=low 2=medium 3=high 4=urgent (Linear scale already inverted)" },
            "labels": { "type": "array", "items": { "type": "string" } },
            "assignee_email": { "type": "string", "nullable": true },
            "assignee_matched": { "type": "boolean" },
            "due_date": { "type": "string", "nullable": true, "description": "YYYY-MM-DD or null" },
            "url": { "type": "string" }
          } } },
          "total": { "type": "integer", "description": "Issues actually fetched" },
          "assignee_misses": { "type": "integer" }
        }
      },
      "LinearImportResult": {
        "type": "object",
        "properties": {
          "created": { "type": "integer" },
          "skipped": { "type": "integer" },
          "failed": { "type": "integer" },
          "errors": { "type": "array", "items": { "type": "object", "properties": { "identifier": { "type": "string", "description": "Linear issue identifier" }, "message": { "type": "string" } } } },
          "assignee_misses": { "type": "integer" }
        }
      },
      "PlaneImportUnresolved": {
        "type": "object",
        "properties": {
          "people": { "type": "array", "items": { "type": "string" }, "description": "Plane display names (assignees, creators, comment authors, subscribers) that could not be matched to workspace members — always unresolved, no silent guessing" },
          "states": { "type": "array", "items": { "type": "string" }, "description": "State names with no case-insensitive match in the target project" },
          "labels": { "type": "array", "items": { "type": "string" }, "description": "Label names with no case-insensitive match" },
          "cycles": { "type": "array", "items": { "type": "string" }, "description": "Cycle names with no case-insensitive match" },
          "modules": { "type": "array", "items": { "type": "string" }, "description": "Module names with no case-insensitive match" }
        }
      },
      "PlaneImportAnalysis": {
        "type": "object",
        "properties": {
          "project_identifier": { "type": "string", "description": "The Plane project_identifier all rows share" },
          "issue_count": { "type": "integer" },
          "unresolved": { "$ref": "#/components/schemas/PlaneImportUnresolved" },
          "warnings": { "type": "array", "items": { "type": "string" }, "description": "Non-fatal notes: estimate mismatches, ambiguous people, duplicate identifiers, row-level parse failures" }
        }
      },
      "PlaneImportRowError": {
        "type": "object",
        "properties": {
          "identifier": { "type": "string", "description": "Plane issue identifier (e.g. ACME-42)" },
          "message": { "type": "string" }
        }
      },
      "PlaneImportGap": {
        "type": "object",
        "properties": {
          "identifier": { "type": "string", "description": "Plane issue identifier (e.g. ACME-42)" },
          "losses": { "type": "array", "items": { "type": "string" }, "description": "Honest loss list for the issue: dropped relations, links, unset estimates, dangling parents, attachment counts without files" }
        }
      },
      "PlaneImportReport": {
        "type": "object",
        "properties": {
          "project_identifier": { "type": "string" },
          "created": { "type": "integer" },
          "skipped": { "type": "integer", "description": "Rows skipped as already imported (idempotent re-run)" },
          "failed": { "type": "integer" },
          "errors": { "type": "array", "items": { "$ref": "#/components/schemas/PlaneImportRowError" } },
          "gaps": { "type": "array", "items": { "$ref": "#/components/schemas/PlaneImportGap" } },
          "states_created": { "type": "array", "items": { "type": "string" }, "description": "Created states land in the backlog group unless a resolution pinned the group" },
          "labels_created": { "type": "array", "items": { "type": "string" } },
          "cycles_created": { "type": "array", "items": { "type": "string" }, "description": "Reported as \"name (start → end)\"" },
          "modules_created": { "type": "array", "items": { "type": "string" } },
          "warnings": { "type": "array", "items": { "type": "string" } }
        }
      },
      "ShareLink": {
        "type": "object",
        "description": "One share link, management view (service.ShareLink) — never served publicly. The public endpoint returns the sanitized PublicShare envelope instead.",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "token": { "type": "string" },
          "scope": { "type": "string", "enum": ["issue", "page"], "description": "What the token shares." },
          "expires_at": { "type": "string", "format": "date-time", "nullable": true, "description": "Expiry; absent when the link never expires." },
          "revoked_at": { "type": "string", "format": "date-time", "nullable": true, "description": "Revocation timestamp; absent while the link is live. Revoked tokens answer 404." },
          "created_at": { "type": "string", "format": "date-time" }
        }
      },
      "ShareCreateResponse": {
        "type": "object",
        "properties": {
          "token": { "type": "string" },
          "url": { "type": "string", "format": "uri" },
          "share": { "$ref": "#/components/schemas/ShareLink" }
        }
      },
      "Subscriber": {
        "type": "object",
        "description": "One subscribed user (service.Subscriber), as returned by GET .../issues/{uuid}/subscribers. A subscription projection, not a User: only user_id, name, email. name is *string + omitempty in Go, so the key is OMITTED when the user has no display name — it is never null.",
        "required": ["user_id", "email"],
        "properties": {
          "user_id": { "type": "string", "format": "uuid" },
          "name": { "type": "string", "description": "Display name; omitted entirely when unset (omitempty), never null." },
          "email": { "type": "string", "format": "email" }
        }
      },
      "AIStatus": {
        "type": "object",
        "properties": {
          "configured": { "type": "boolean" },
          "model": { "type": "string", "nullable": true }
        }
      },
      "AdminStats": {
        "type": "object",
        "properties": {
          "users": { "type": "integer" },
          "workspaces": { "type": "integer" },
          "projects": { "type": "integer" },
          "issues": { "type": "integer" }
        }
      },
      "AdminUser": {
        "type": "object",
        "description": "One instance-level user (service.AdminUser), as returned by GET /api/v1/admin/users. name is *string WITHOUT omitempty in Go, so the key is always present — null when the user has no display name (contrast Subscriber.name, which is omitted when unset). Every other field likewise has no omitempty, so all seven keys are always present.",
        "required": ["id", "email", "name", "is_admin", "is_active", "workspace_count", "created_at"],
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "email": { "type": "string", "format": "email" },
          "name": { "type": "string", "nullable": true, "description": "Display name; always present, null when unset (no omitempty on the Go field)." },
          "is_admin": { "type": "boolean", "description": "Instance-admin flag; the only field PATCH /api/v1/admin/users/{id} changes." },
          "is_active": { "type": "boolean", "description": "false = deactivated: the user cannot log in." },
          "workspace_count": { "type": "integer", "description": "Number of workspaces the user is a member of." },
          "created_at": { "type": "string", "format": "date-time" }
        }
      },
      "IssueLink": {
        "type": "object",
        "description": "One directed dependency edge (service.IssueLink).",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "issue_id": { "type": "string", "format": "uuid" },
          "target_issue_id": { "type": "string", "format": "uuid" },
          "kind": { "type": "string", "enum": ["blocks", "relates_to", "duplicates"], "description": "Strict vocabulary; empty input stores the DB default 'blocks'." },
          "created_at": { "type": "string", "format": "date-time" },
          "direction": { "type": "string", "enum": ["outgoing", "incoming"], "description": "Derived, never stored: outgoing when the addressed issue is the source, incoming when it is the target. Present only on the single-issue links endpoint; omitted in the issue-list envelope (the batch caller derives direction from the endpoints)." }
        }
      },
      "PageIssueLink": {
        "type": "object",
        "description": "One page↔issue link row (C36T0). A link is a pointer, not a copy.",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "page_id": { "type": "string", "format": "uuid" },
          "issue_id": { "type": "string", "format": "uuid" },
          "created_by": { "type": "string", "format": "uuid" },
          "created_at": { "type": "string", "format": "date-time" }
        }
      },
      "LinkedIssue": {
        "type": "object",
        "description": "A page's linked issue (C36T0): display_id, title, state, priority, ordered by issue created_at.",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "display_id": { "type": "string" },
          "title": { "type": "string" },
          "state": { "type": "string", "description": "State name" },
          "state_id": { "type": "string", "format": "uuid" },
          "priority": { "type": "integer", "minimum": 0, "maximum": 4 }
        }
      },
      "LinkedPage": {
        "type": "object",
        "description": "An issue's linked page (C36T0): title, updated_at, ordered by page updated_at desc.",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "title": { "type": "string" },
          "updated_at": { "type": "string", "format": "date-time" }
        }
      },
      "ExternalRef": {
        "type": "object",
        "description": "A PR or commit linked to an issue (C17T0 two-way GitHub linkage).",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "issue_id": { "type": "string", "format": "uuid" },
          "provider": { "type": "string", "example": "github" },
          "repo": { "type": "string", "description": "Repository as owner/name" },
          "ref_type": { "type": "string", "enum": ["pr", "commit"] },
          "ref_id": { "type": "string", "description": "PR number or commit SHA" },
          "url": { "type": "string" },
          "state": { "type": "string", "enum": ["open", "merged", "closed"] },
          "created_at": { "type": "string", "format": "date-time" }
        }
      },
      "IssueRelation": {
        "type": "object",
        "properties": {
          "related_issue_id": { "type": "string", "format": "uuid" },
          "type": { "type": "string" },
          "derived": { "type": "boolean", "description": "True for derived reverse rows" }
        }
      },
      "WorkItem": {
        "type": "object",
        "properties": {
          "kind": { "type": "string", "description": "issue" },
          "issue": { "$ref": "#/components/schemas/Issue" },
          "workspace_slug": { "type": "string" },
          "project_identifier": { "type": "string" }
        }
      },
      "AutomationTrigger": {
        "type": "object",
        "description": "Trigger: issue.state_changed with optional from/to state filters (null matches any); issue.created (fires on issue creation; takes no filters in v1 — filters on it are rejected); issue.assigned / issue.unassigned (an assignee is added / removed; no filters in v1); issue.labels_changed (a label is attached or detached; optional label_ids filter fires only when a listed label is added or removed, null matches any label change); issue.priority_changed (optional from_priorities / to_priorities filters, 0-4: none/low/medium/high/urgent, null matches any); issue.due_date_changed (the issue's target date changes; no filters in v1); issue.estimate_changed (the estimate point changes; no filters in v1); issue.comment_added (a comment is posted; no filters in v1). Scheduled triggers (evaluated by the automation-schedule ticker on GLANCE_AUTOMATION_SCHEDULE_INTERVAL; empty = disabled, they never fire): issue.due_soon (an open issue whose target_date is within window_hours from now; default 48, must be > 0 when set), issue.overdue (an open issue whose target_date has passed; no filters), issue.stale (an open issue with no update in stale_days; default 7, must be > 0 when set), cycle.ending_soon (an open issue attached to a current cycle ending within 72h; no filters). Scheduled firings dedupe one per (rule, issue) per calendar day. Filters that don't belong to a trigger type are rejected rather than silently ignored. Automation-driven changes never re-trigger automations.",
        "properties": {
          "type": { "type": "string", "enum": ["issue.state_changed", "issue.created", "issue.assigned", "issue.unassigned", "issue.labels_changed", "issue.priority_changed", "issue.due_date_changed", "issue.estimate_changed", "issue.comment_added", "issue.due_soon", "issue.overdue", "issue.stale", "cycle.ending_soon"], "example": "issue.state_changed" },
          "from_states": { "type": "array", "items": { "type": "string", "format": "uuid" }, "nullable": true },
          "to_states": { "type": "array", "items": { "type": "string", "format": "uuid" }, "nullable": true },
          "label_ids": { "type": "array", "items": { "type": "string", "format": "uuid" }, "nullable": true, "description": "issue.labels_changed only: fires when any listed label is added or removed. Null matches any label change." },
          "from_priorities": { "type": "array", "items": { "type": "integer", "minimum": 0, "maximum": 4 }, "nullable": true, "description": "issue.priority_changed only: 0-4 (none/low/medium/high/urgent). Null matches any." },
          "to_priorities": { "type": "array", "items": { "type": "integer", "minimum": 0, "maximum": 4 }, "nullable": true, "description": "issue.priority_changed only: 0-4 (none/low/medium/high/urgent). Null matches any." },
          "window_hours": { "type": "integer", "minimum": 1, "nullable": true, "description": "issue.due_soon only: fire for issues whose target_date is within this many hours from now. Default 48. Must be > 0 when set." },
          "stale_days": { "type": "integer", "minimum": 1, "nullable": true, "description": "issue.stale only: fire for open issues with no update in this many days. Default 7. Must be > 0 when set." }
        }
      },
      "AutomationAction": {
        "type": "object",
        "description": "One ordered action: assign (user_id), add_label (label_id), add_comment (body), set_priority (priority 0-4: none/low/medium/high/urgent), set_state (state_id, a state UUID in this project), remove_label (label_id), unassign (no parameters — clears every assignee), set_estimate (estimate, an estimate-point UUID on one of this project's scales), set_due_date (due_date: an absolute ISO date \"YYYY-MM-DD\" or a relative offset \"+Nd\" days from the firing time), move_to_cycle (cycle_id, a cycle UUID in this project — the issue leaves any other cycles), move_to_module (module_id, a module UUID in this project — the issue leaves any other modules), add_watcher (user_id, a workspace member, added as an issue subscriber). set_priority/set_state targeting the current value are no-ops: no activity row, and a firing of only no-ops writes no run row. A failed action is recorded on the run row as ok:false and aborts the rule's remaining actions (a half-applied rule is worse than a stopped one); it never rolls back the firing event. A set_state move into a completed state is rejected by the blocker guard when the issue has open blockers — recorded on the run row as ok:false, never a silent skip.",
        "properties": {
          "type": { "type": "string", "enum": ["assign", "add_label", "add_comment", "set_priority", "set_state", "remove_label", "unassign", "set_estimate", "set_due_date", "move_to_cycle", "move_to_module", "add_watcher"] },
          "user_id": { "type": "string", "format": "uuid" },
          "label_id": { "type": "string", "format": "uuid" },
          "body": { "type": "string", "maxLength": 10000 },
          "priority": { "type": "integer", "minimum": 0, "maximum": 4 },
          "state_id": { "type": "string", "format": "uuid" },
          "cycle_id": { "type": "string", "format": "uuid", "description": "move_to_cycle only: the cycle UUID in this project the issue moves into." },
          "module_id": { "type": "string", "format": "uuid", "description": "move_to_module only: the module UUID in this project the issue moves into." },
          "estimate": { "type": "string", "format": "uuid", "description": "set_estimate only: the estimate-point UUID on one of this project's scales." },
          "due_date": { "type": "string", "description": "set_due_date only: an absolute ISO date \"YYYY-MM-DD\" or a relative offset \"+Nd\" days from the firing time." }
        }
      },
      "AutomationRule": {
        "type": "object",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "project_id": { "type": "string", "format": "uuid" },
          "name": { "type": "string" },
          "trigger": { "$ref": "#/components/schemas/AutomationTrigger" },
          "actions": { "type": "array", "items": { "$ref": "#/components/schemas/AutomationAction" } },
          "enabled": { "type": "boolean" },
          "created_by": { "type": "string", "format": "uuid" },
          "created_at": { "type": "string", "format": "date-time" },
          "updated_at": { "type": "string", "format": "date-time" }
        }
      },
      "AutomationRun": {
        "type": "object",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "rule_id": { "type": "string", "format": "uuid" },
          "rule_name": { "type": "string" },
          "issue_id": { "type": "string", "format": "uuid" },
          "issue_display_id": { "type": "string", "nullable": true },
          "trigger_type": { "type": "string" },
          "fired_at": { "type": "string", "format": "date-time" },
          "actions": { "type": "array", "items": { "$ref": "#/components/schemas/AutomationActionResult" } }
        }
      },
      "AutomationActionResult": {
        "type": "object",
        "properties": {
          "type": { "type": "string", "enum": ["assign", "add_label", "add_comment", "set_priority", "set_state"] },
          "ok": { "type": "boolean" },
          "error": { "type": "string" }
        }
      }
    }
  }
}
