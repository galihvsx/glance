    "/api/v1/workspaces/{slug}/projects/{identifier}/schedules/{scheduleID}/run-now": {
      "post": {
        "tags": ["recurring"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Fire a schedule's next occurrence now",
        "description": "Member (15)+. Manual fire for testing a rule: creates the issue for the schedule's pending next_run_at immediately (not at wall-clock now), with the CALLING user as the issue's actor, then advances the schedule exactly like the ticker would. An inactive or exhausted schedule is a 400.",
        "parameters": [ { "$ref": "#/components/parameters/Slug" }, { "$ref": "#/components/parameters/Identifier" }, { "name": "scheduleID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } } ],
        "responses": { "200": { "description": "The created issue and the updated schedule", "content": { "application/json": { "schema": { "type": "object", "properties": { "issue": { "$ref": "#/components/schemas/Issue" }, "schedule": { "$ref": "#/components/schemas/RecurringSchedule" } } } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/workspaces/{slug}/projects/{identifier}/issues": {
      "get": {
        "tags": ["issues"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "List issues",
        "description": "List the project's issues with filtering, ordering and cursor pagination. Filters: state, priority, label, assignee, estimate, cycle, parent, epic, q (full-text), fields, draft, sequence_id, undated, due_date_empty, subscribed, archived, and created/updated/due/start date ranges. Ordering: order_by (default -updated_at); an invalid order_by is 400. Pagination is cursor-only (per_page 1-100, default 25; an out-of-range or non-integer per_page is 400) — there is no page param. deleted=1 selects the trash list: deleted-only, most recently deleted first. Deleted rows are excluded from every other list mode; this flag is the only way to see them. Other filters/order are ignored in trash mode.",
        "parameters": [
          { "$ref": "#/components/parameters/Slug" }, { "$ref": "#/components/parameters/Identifier" },
          { "name": "per_page", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 25, "description": "Rows per page. Out-of-range or non-integer values are 400." } },
          { "name": "cursor", "in": "query", "schema": { "type": "string", "description": "Opaque cursor from the previous page's next_cursor; bound to the order_by it was minted for. A malformed or foreign cursor is 400." } },
          { "name": "order_by", "in": "query", "schema": { "type": "string", "enum": ["updated_at", "-updated_at", "created_at", "-created_at", "sequence_id", "-sequence_id", "sort_order", "-sort_order", "priority", "-priority"], "default": "-updated_at", "description": "Ordering key; a leading - reverses it. Invalid values are 400." } },
          { "name": "state", "in": "query", "schema": { "type": "string", "format": "uuid", "description": "State UUID; a malformed UUID is 400." } },
          { "name": "priority", "in": "query", "schema": { "type": "string", "description": "Comma-separated priority ints 0-4; out-of-range values are 400." } },
          { "name": "label", "in": "query", "schema": { "type": "string", "description": "Comma-separated label UUIDs; a malformed UUID is 400." } },
          { "name": "assignee", "in": "query", "schema": { "type": "string", "description": "Comma-separated user UUIDs; \"none\" = unassigned. A malformed UUID is 400." } },
          { "name": "estimate", "in": "query", "schema": { "type": "string", "description": "Comma-separated estimate-point UUIDs; \"none\" = no estimate. A malformed UUID is 400." } },
          { "name": "cycle", "in": "query", "schema": { "type": "string", "format": "uuid", "description": "Cycle UUID; a malformed UUID is 400." } },
          { "name": "parent", "in": "query", "schema": { "type": "string", "description": "Comma-separated (repeatable) parent issue UUIDs; \"none\" = top-level issues (parent_id IS NULL). A malformed UUID is 400." } },
          { "name": "epic", "in": "query", "schema": { "type": "string", "description": "Comma-separated (repeatable) epic UUIDs (epic_issues junction); \"none\" = issues in no epic. A malformed UUID is 400." } },
          { "name": "q", "in": "query", "schema": { "type": "string", "description": "Full-text search over issue name + description (English stemming)." } },
          { "name": "fields", "in": "query", "schema": { "type": "string", "description": "Comma-separated field names; only description has an effect — description is omitted unless requested." } },
          { "name": "draft", "in": "query", "schema": { "type": "string", "enum": ["true", "false", "1", "0"], "description": "Draft tri-state: absent = drafts excluded (working-set default); true/1 = drafts only; false/0 = explicitly exclude drafts. Any other value is 400." } },
          { "name": "sequence_id", "in": "query", "schema": { "type": "integer", "minimum": 1, "description": "Per-project display-ID lookup (one issue); non-positive or non-integer values are 400. Bypasses the draft filter." } },
          { "name": "undated", "in": "query", "schema": { "type": "string", "enum": ["1", "true"], "description": "Only issues with neither a target date nor a start date." } },
          { "name": "due_date_empty", "in": "query", "schema": { "type": "string", "enum": ["1", "true"], "description": "Only issues with no due date (target_date IS NULL). Combines with every other filter; cannot be combined with due_after/due_before on the same request (400)." } },
          { "name": "subscribed", "in": "query", "schema": { "type": "string", "enum": ["1", "true"], "description": "Only issues the caller is subscribed to." } },
          { "name": "archived", "in": "query", "schema": { "type": "string", "enum": ["1", "true"], "description": "Include archived issues; absent (default) excludes them." } },
          { "name": "deleted", "in": "query", "schema": { "type": "string", "enum": ["1", "true"], "description": "Deleted-only (trash): returns only soft-deleted issues, most recently deleted first. Deleted rows are excluded from every other list mode; this flag is the only way to see them. Other filters/order are ignored in trash mode. Trash cursors are minted for trash order; a normal-list cursor is invalid here." } },
          { "name": "include_links", "in": "query", "schema": { "type": "string", "enum": ["1", "true"], "description": "Attach the dependency edges touching the listed issues as a top-level links array. Does not apply in trash mode." } },
          { "name": "include_project_structure", "in": "query", "schema": { "type": "string", "enum": ["1", "true"], "description": "Attach each row's cycle/module/release membership as project_structure. Ignored in trash mode." } },
          { "name": "created_after", "in": "query", "schema": { "type": "string", "format": "date-time", "description": "RFC3339; matches created_at >= value. Invalid values are 400." } },
          { "name": "created_before", "in": "query", "schema": { "type": "string", "format": "date-time", "description": "RFC3339; matches created_at < value. Invalid values are 400." } },
          { "name": "updated_after", "in": "query", "schema": { "type": "string", "format": "date-time", "description": "RFC3339; matches updated_at > value (strictly after). Invalid values are 400." } },
          { "name": "updated_before", "in": "query", "schema": { "type": "string", "format": "date-time", "description": "RFC3339; matches updated_at < value. Invalid values are 400." } },
          { "name": "due_after", "in": "query", "schema": { "type": "string", "format": "date-time", "description": "RFC3339; matches target_date >= value (date part). Invalid values are 400." } },
          { "name": "due_before", "in": "query", "schema": { "type": "string", "format": "date-time", "description": "RFC3339; matches target_date < value (date part). Invalid values are 400." } },
          { "name": "start_after", "in": "query", "schema": { "type": "string", "format": "date-time", "description": "RFC3339; matches start_date >= value (date part). Invalid values are 400." } },
          { "name": "start_before", "in": "query", "schema": { "type": "string", "format": "date-time", "description": "RFC3339; matches start_date < value (date part). Invalid values are 400." } }
        ],
        "responses": { "200": { "description": "Issue list", "content": { "application/json": { "schema": { "type": "object", "properties": { "results": { "type": "array", "items": { "$ref": "#/components/schemas/Issue" } }, "next_cursor": { "type": "string", "description": "Opaque cursor for the next page (pass as ?cursor=); omitted on the last page." }, "links": { "type": "array", "items": { "$ref": "#/components/schemas/IssueLink" }, "description": "Dependency edges touching the listed issues; present only with ?include_links=true, omitted otherwise." } } } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "404": { "$ref": "#/components/responses/NotFound" } }
      },
      "post": {
        "tags": ["issues"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Create an issue",
        "description": "Creates the issue with the next atomic sequence_id (display ID {IDENTIFIER}-{sequence_id}). Honors Idempotency-Key: a replayed key returns the stored response byte-identical without creating a second issue. C18T1: an optional custom_values map is written atomically with the issue; on a non-draft create every required custom field of the project must arrive non-empty (absent/null/empty count as missing, checkbox false counts as present) — otherwise 400 with code bad_request, the message naming the missing fields and details.field_names listing them. Drafts skip the required check.",
        "parameters": [ { "$ref": "#/components/parameters/Slug" }, { "$ref": "#/components/parameters/Identifier" }, { "$ref": "#/components/parameters/IdempotencyKey" } ],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/IssueCreate" } } } },
        "responses": { "201": { "description": "Created issue", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Issue" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/workspaces/{slug}/projects/{identifier}/issues/similar": {
      "get": {
        "tags": ["issues"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Find possible duplicate issues by title",
        "description": "C8T7 duplicate detection: returns up to 5 of the project's working-set issues whose titles are trigram-similar (pg_trgm similarity > 0.3) to ?q=, most-similar first. Archived, draft and soft-deleted issues are excluded; non-members get 404. Used by the create-issue modal's \"Possible duplicates\" suggestions (debounced).",
        "parameters": [
          { "$ref": "#/components/parameters/Slug" }, { "$ref": "#/components/parameters/Identifier" },
          { "name": "q", "in": "query", "required": true, "schema": { "type": "string", "minLength": 1, "description": "Title to compare against issue titles. Blank is a 400." } }
        ],
        "responses": {
          "200": { "description": "Up to 5 similar issues, most-similar first", "content": { "application/json": { "schema": { "type": "array", "items": { "$ref": "#/components/schemas/SimilarIssue" } } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/api/v1/workspaces/{slug}/projects/{identifier}/issues/export": {
      "get": {
        "tags": ["issues"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Export issues as CSV or JSON",
        "description": "Streams the project's filtered working set as a downloadable file (Content-Disposition: attachment; filename glance-<IDENTIFIER>-issues-<YYYY-MM-DD>.csv|.json, UTC date). Honors the same filter params as the issue list (q, archived, state, priority, label, assignee, estimate, cycle, date ranges, undated, due_date_empty, subscribed, draft); pagination/sort params are accepted and ignored — the whole filtered set streams in display-ID order. format defaults to csv. CSV columns: display_id, name, state, priority (none/low/medium/high/urgent), assignee (semicolon-joined emails), labels (semicolon-joined names), estimate (estimate-point key), due_date (YYYY-MM-DD), created_at, updated_at (RFC3339). Cells starting with =, +, - or @ get a single-quote prefix (spreadsheet formula-injection mitigation). JSON is an array of issue objects in the list shape (description always included). Rows stream from a DB cursor — never fully materialized. A pre-stream COUNT enforces the 50000-row cap: over-cap exports fail 400 naming the matched count (never a truncated file). Any workspace member (guests included) may export.",
        "parameters": [
          { "$ref": "#/components/parameters/Slug" }, { "$ref": "#/components/parameters/Identifier" },
          { "name": "format", "in": "query", "schema": { "type": "string", "enum": ["csv", "json"], "default": "csv" } },
          { "name": "q", "in": "query", "schema": { "type": "string", "description": "Full-text search (same as list)" } },
          { "name": "archived", "in": "query", "schema": { "type": "string", "enum": ["1", "true"], "description": "Include archived issues (default: working set only)" } },
          { "name": "state", "in": "query", "schema": { "type": "string", "format": "uuid", "description": "State UUID" } },
          { "name": "priority", "in": "query", "schema": { "type": "string", "description": "Comma-separated ints 0-4" } },
          { "name": "label", "in": "query", "schema": { "type": "string", "description": "Comma-separated label UUIDs" } },
          { "name": "assignee", "in": "query", "schema": { "type": "string", "description": "Comma-separated user UUIDs; \"none\" = unassigned" } },
          { "name": "estimate", "in": "query", "schema": { "type": "string", "description": "Comma-separated estimate-point UUIDs; \"none\" = no estimate" } },
          { "name": "cycle", "in": "query", "schema": { "type": "string", "format": "uuid" } },
          { "name": "due_after", "in": "query", "schema": { "type": "string", "format": "date-time", "description": "RFC3339" } },
          { "name": "due_before", "in": "query", "schema": { "type": "string", "format": "date-time", "description": "RFC3339" } },
          { "name": "subscribed", "in": "query", "schema": { "type": "string", "enum": ["1", "true"] } },
          { "name": "draft", "in": "query", "schema": { "type": "string", "enum": ["true", "false", "1", "0"], "description": "Draft tri-state; absent = working-set default (drafts excluded)" } }
        ],
        "responses": {
          "200": { "description": "Exported file", "content": { "text/csv": { "schema": { "type": "string" } }, "application/json": { "schema": { "type": "array", "items": { "$ref": "#/components/schemas/Issue" } } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/api/v1/workspaces/{slug}/projects/{identifier}/issues/bulk": {
      "patch": {
        "tags": ["issues"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Atomically set fields on many issues",
        "description": "Applies ONE set to many issues in a single fully-atomic transaction — any unknown, deleted, cross-project, or malformed id, or any invalid set field, aborts the whole batch (no partial application). 200 with {updated, issue_ids}. Member (15)+. The blocker guard applies per issue: a move into a completed state with open blockers aborts the batch with 409 code open_blockers unless set.ignore_blockers=true. Workflow transition rules apply to the FINAL state value (after automation cascades): a net (before → final) move that is not a listed pair aborts the batch with 409 code state_transition_not_allowed.",
        "parameters": [ { "$ref": "#/components/parameters/Slug" }, { "$ref": "#/components/parameters/Identifier" } ],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["issue_ids", "set"], "properties": { "issue_ids": { "type": "array", "items": { "type": "string", "format": "uuid" } }, "set": { "type": "object", "properties": { "state_id": { "type": "string", "format": "uuid" }, "priority": { "type": "integer" }, "label_ids": { "type": "array", "items": { "type": "string", "format": "uuid" }, "description": "null = untouched; non-null replaces the label set (empty clears)" }, "assignee_id": { "type": "object", "description": "Tri-state: omitted = untouched, null value = clear all, value = replace with that user", "properties": { "set": { "type": "boolean" }, "value": { "type": "string", "format": "uuid", "nullable": true } } }, "ignore_blockers": { "type": "boolean", "description": "Bypass the open-blocker guard for the whole batch" } } } } } } } },
        "responses": { "200": { "description": "Bulk set result", "content": { "application/json": { "schema": { "type": "object", "properties": { "updated": { "type": "integer" }, "issue_ids": { "type": "array", "items": { "type": "string" } } } } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "409": { "$ref": "#/components/responses/Conflict" } }
      }
    },
    "/api/v1/workspaces/{slug}/projects/{identifier}/issues/bulk-update": {
      "post": {
        "tags": ["issues"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Bulk-update many issues (partial success)",
        "description": "Applies one tri-state patch to many issues inside a single transaction (per-item savepoints → partial success). 200 with {results:[{id, ok, error?}]}. The blocker guard applies per item: a blocked move reports ok:false with an \"open blockers\" error (pass patch.ignore_blockers=true to force the batch). Workflow transition rules apply per item the same way: a disallowed move reports ok:false with a \"state transition not allowed\" error. Member (15)+. Honors Idempotency-Key.",
        "parameters": [ { "$ref": "#/components/parameters/Slug" }, { "$ref": "#/components/parameters/Identifier" }, { "$ref": "#/components/parameters/IdempotencyKey" } ],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["ids", "patch"], "properties": { "ids": { "type": "array", "items": { "type": "string", "format": "uuid" } }, "patch": { "$ref": "#/components/schemas/IssuePatch" } } } } } },
        "responses": { "200": { "description": "Per-item results", "content": { "application/json": { "schema": { "type": "object", "properties": { "results": { "type": "array", "items": { "type": "object", "properties": { "id": { "type": "string" }, "ok": { "type": "boolean" }, "error": { "type": "string" } } } } } } } } } } 
      }
    },
    "/api/v1/workspaces/{slug}/projects/{identifier}/issues/bulk-delete": {
      "post": {
        "tags": ["issues"], "security": [{ "sessionCookie": [] }, { "apiToken": [] }],
        "summary": "Bulk-delete many issues",
        "description": "Soft-deletes many issues with per-item savepoint semantics: each item reports {id, ok, error?}; an unknown or malformed id fails per-item (error \"issue not found\"), not the whole batch. Empty ids → 400; more than 100 ids → 400. Member (15)+. Honors Idempotency-Key.",
        "parameters": [ { "$ref": "#/components/parameters/Slug" }, { "$ref": "#/components/parameters/Identifier" }, { "$ref": "#/components/parameters/IdempotencyKey" } ],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["ids"], "properties": { "ids": { "type": "array", "items": { "type": "string", "format": "uuid" } } } } } } },
        "responses": { "200": { "description": "Per-item results", "content": { "application/json": { "schema": { "type": "object", "properties": { "results": { "type": "array", "items": { "type": "object", "properties": { "id": { "type": "string" }, "ok": { "type": "boolean" }, "error": { "type": "string" } } } } } } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/workspaces/{slug}/projects/{identifier}/issues/bulk-restore": {
      "post": {
