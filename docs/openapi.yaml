          "source": { "type": "string" },
          "total": { "type": "integer", "description": "Issues actually fetched (the v3 search API returns no total count)" },
          "rows": { "type": "array", "items": { "type": "object", "properties": {
            "key": { "type": "string" },
            "title": { "type": "string" },
            "status": { "type": "string", "description": "Jira status name" },
            "state": { "type": "string", "description": "Matched glance state name, or the status name when state_is_new" },
            "state_is_new": { "type": "boolean" },
            "labels": { "type": "array", "items": { "type": "string" } },
            "new_labels": { "type": "array", "items": { "type": "string" } },
            "priority": { "type": "integer", "description": "0=none 1=low 2=medium 3=high 4=urgent" },
            "assignee": { "type": "string", "nullable": true, "description": "Jira assignee display name" },
            "assignee_matched": { "type": "boolean" },
            "comments": { "type": "integer" },
            "issue_type": { "type": "string" },
            "already_imported": { "type": "boolean" }
          } } }
        }
      },
      "JiraImportResult": {
        "type": "object",
        "properties": {
          "source": { "type": "string" },
          "created": { "type": "integer" },
          "skipped": { "type": "integer" },
          "failed": { "type": "integer" },
          "labels_created": { "type": "array", "items": { "type": "string" } },
          "states_created": { "type": "array", "items": { "type": "string" } },
          "assignee_misses": { "type": "integer" },
          "errors": { "type": "array", "items": { "type": "object", "properties": { "row": { "type": "integer", "description": "1-based ordinal of the issue in the fetched batch" }, "message": { "type": "string" } } } }
        }
      },
      "TrelloImportPreview": {
        "type": "object",
        "properties": {
          "source": { "type": "string", "description": "Trello board name" },
          "board_id": { "type": "string" },
          "total": { "type": "integer" },
          "rows": { "type": "array", "items": { "type": "object", "properties": {
            "id": { "type": "string" },
            "short_link": { "type": "string" },
            "short_url": { "type": "string" },
            "name": { "type": "string" },
            "list_name": { "type": "string", "description": "Trello list name" },
            "state": { "type": "string", "description": "Matched glance state name, or the list name when state_is_new" },
            "state_is_new": { "type": "boolean" },
            "labels": { "type": "array", "items": { "type": "string" } },
            "new_labels": { "type": "array", "items": { "type": "string" } },
            "due_date": { "type": "string", "nullable": true, "description": "YYYY-MM-DD (UTC) when the card has a due date" },
            "assignees": { "type": "array", "items": { "type": "string" }, "description": "Trello usernames" },
            "assignee_matched": { "type": "boolean" },
            "comments": { "type": "integer" },
            "checklists": { "type": "integer", "description": "Checklist count (badges); checklists are never imported" },
            "already_imported": { "type": "boolean" }
          } } }
        }
      },
      "TrelloImportResult": {
        "type": "object",
        "properties": {
          "source": { "type": "string" },
          "board_id": { "type": "string" },
          "created": { "type": "integer" },
          "skipped": { "type": "integer" },
          "archived_skipped": { "type": "integer" },
          "failed": { "type": "integer" },
          "labels_created": { "type": "array", "items": { "type": "string" } },
          "states_created": { "type": "array", "items": { "type": "string" } },
          "assignee_misses": { "type": "integer" },
          "checklists_skipped": { "type": "integer" },
          "errors": { "type": "array", "items": { "type": "object", "properties": { "row": { "type": "integer", "description": "1-based ordinal of the card in the fetched batch" }, "message": { "type": "string" } } } }
        }
      },
      "ShareLink": {
        "type": "object",
        "properties": {
          "token": { "type": "string" },
          "expires_at": { "type": "string", "format": "date-time", "nullable": true },
          "created_at": { "type": "string", "format": "date-time" }
        }
      },
      "ShareCreateResponse": {
        "type": "object",
        "properties": {
          "token": { "type": "string" },
          "url": { "type": "string", "format": "uri" },
          "share": { "$ref": "#/components/schemas/ShareLink" }
        }
      },
      "AIStatus": {
        "type": "object",
        "properties": {
          "configured": { "type": "boolean" },
          "model": { "type": "string", "nullable": true }
        }
      },
      "AdminStats": {
        "type": "object",
        "properties": {
          "users": { "type": "integer" },
          "workspaces": { "type": "integer" },
          "projects": { "type": "integer" },
          "issues": { "type": "integer" }
        }
      },
      "IssueLink": {
        "type": "object",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "target_issue_id": { "type": "string", "format": "uuid" },
          "kind": { "type": "string" }
        }
      },
      "IssueRelation": {
        "type": "object",
        "properties": {
          "related_issue_id": { "type": "string", "format": "uuid" },
          "type": { "type": "string" },
          "derived": { "type": "boolean", "description": "True for derived reverse rows" }
        }
      },
      "WorkItem": {
        "type": "object",
        "properties": {
          "kind": { "type": "string", "description": "issue" },
          "issue": { "$ref": "#/components/schemas/Issue" },
          "workspace_slug": { "type": "string" },
          "project_identifier": { "type": "string" }
        }
      }
    }
  }
}
