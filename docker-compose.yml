# glance — self-hosted deployment.
#
# Usage:
#   docker compose up --build
#
# Then open http://localhost:8080 — the app runs DB migrations itself on
# startup, no manual setup needed.
#
# The default postgres credentials below are for local/dev use. For a real
# deployment, change them (POSTGRES_PASSWORD + DATABASE_URL together).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: glance
      POSTGRES_PASSWORD: glance
      POSTGRES_DB: glance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glance -d glance"]
      interval: 5s
      timeout: 5s
      retries: 10

  glance:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://glance:glance@postgres:5432/glance?sslmode=disable
      PORT: "8080"
      APP_URL: http://localhost:8080
      # SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASSWORD / SMTP_FROM are
      # optional — when unset, outbound mail falls back to logging (Phase 1+).

volumes:
  pgdata:
